    })()}
  </div>);
}

/* ══ KANBAN ITEM ════════════════════════════════════════ */
function KanbanItem({item,onUpdate,onDelete,onDragStart,onDragEnd,isDragging,typeFilter,personFilter}){
  const[pressing,setP]=useState(false);
  const idx=STATUSES.indexOf(item.status);
  const isDone=item.status==='done',isTodo=item.status==='todo';
  if(typeFilter!=='all'&&item.type!==typeFilter)return null;
  if(personFilter==='none'&&item.assignee)return null;
  if(personFilter&&personFilter!=='all'&&personFilter!=='none'&&item.assignee!==personFilter)return null;
  const advance=e=>{e.stopPropagation();setP(false);if(isDone)return;onUpdate({...item,status:STATUSES[Math.min(idx+1,STATUSES.length-1)],updatedBy:window.__un||'Kullanıcı',updatedAt:new Date().toISOString()});};
  const revert=e=>{e.stopPropagation();if(idx===0)return;onUpdate({...item,status:STATUSES[idx-1],updatedBy:window.__un||'Kullanıcı',updatedAt:new Date().toISOString()});};
  let cbEx='';if(isDone)cbEx='cb-done';else if(pressing)cbEx='cb-press';else if(item.status==='inprogress')cbEx='cb-p1';else if(item.status==='review')cbEx='cb-p2';
  return(<div className={`ki${isDragging?' dragging':''}`} draggable onDragStart={e=>{e.stopPropagation();onDragStart(item.id);}} onDragEnd={onDragEnd} title={item.updatedAt?`Son: ${item.updatedBy||'?'} — ${new Date(item.updatedAt).toLocaleString('tr-TR')}`:''}>
    <div className="ki-top">
      <div className="cb" onMouseDown={e=>{e.stopPropagation();if(!isDone)setP(true);}} onMouseUp={e=>{e.stopPropagation();advance(e);}} onMouseLeave={()=>setP(false)} onTouchStart={e=>{e.stopPropagation();if(!isDone)setP(true);}} onTouchEnd={e=>{e.stopPropagation();advance(e);}}>
        <div className={`cb-box ${item.type==='bug'?'cb-bug':'cb-task'} ${cbEx}`}>{isDone&&'✓'}</div>
      </div>
      <div className="ki-title" style={{textDecoration:isDone?'line-through':'none',opacity:isDone?.55:1}}>{item.title}</div>
      <span className={`tyb ${item.type==='bug'?'tyb-bug':'tyb-task'}`}>{item.type==='bug'?'🐞':'📋'}</span>
    </div>
    {(item.linkedTask||item.assignee)&&<div className="ki-tags">
      {item.linkedTask&&<span className="badge b-gy" style={{maxWidth:130,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',cursor:'default'}} title={item.linkedTask}>📌 {item.linkedTask}</span>}
      {item.assignee&&<span className="badge b-bl">👤 {item.assignee}</span>}
    </div>}
    <div className="ki-foot">
      <div className="ki-meta">{item.updatedAt?`↗ ${new Date(item.updatedAt).toLocaleDateString('tr-TR')}`:''}</div>
      <div className="ki-ctrl">
        {isTodo&&<button className="edit-b" onClick={e=>{e.stopPropagation();onUpdate({...item,_edit:true});}} title="Düzenle">✏</button>}
        {idx>0&&<button className="back-b" onClick={revert} title={`Geri → ${SL[STATUSES[idx-1]]}`}>↩</button>}
        {isTodo&&<button className="del-b" style={{opacity:1}} onClick={e=>{e.stopPropagation();onDelete(item.id);}} title="Sil">×</button>}
      </div>
    </div>
  </div>);
}

/* ══ ITEM MODAL ═════════════════════════════════════════ */
function ItemModal({initial,teamId,projectTeams,projTasks,onSave,onClose}){
  const team=(projectTeams||[]).find(t=>t.id===teamId);
  const members=(team?.members)||[];
  // Ana ekip VEYA destek ekip olarak bağlı görevleri listele
  const teamTasks=(projTasks||[]).filter(t=>t.teamName===team?.name||(t.supportTeams||[]).includes(team?.name));
  const[f,setF]=useState(initial?{title:initial.title,type:initial.type,linkedTask:initial.linkedTask||'',assignee:initial.assignee||''}:{title:'',type:'task',linkedTask:'',assignee:''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const submit=()=>{if(!f.title.trim())return;onSave({...f});};
  return(<div className="mbd"><div className="modal modal-sm">
    <div className="modal-title">{initial?'Öğeyi Düzenle':'Yeni İş Öğesi'}</div>
    {!initial&&<div className="banner bn-i" style={{marginBottom:12,fontSize:'.78rem'}}>📌 To Do sütununa eklenir</div>}
    <div className="fr"><div><label className="lbl">Başlık *</label><input className="inp" placeholder="Öğe başlığı..." value={f.title} onChange={e=>set('title',e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submit();}} autoFocus/></div></div>
    <div className="fr"><div><label className="lbl">Tür</label><div style={{display:'flex',gap:7}}>{['task','bug'].map(t=><label key={t} style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',padding:'7px 14px',borderRadius:'var(--r)',border:`1px solid ${f.type===t?'var(--accent)':'var(--border)'}`,background:f.type===t?'var(--accent-l)':'transparent',flex:1,justifyContent:'center',userSelect:'none',transition:'all .14s'}}><input type="radio" value={t} checked={f.type===t} onChange={()=>set('type',t)} style={{display:'none'}}/><span style={{fontSize:'.83rem'}}>{t==='task'?'📋 Task':'🐞 Bug'}</span></label>)}</div></div></div>
    {teamTasks.length>0&&<div className="fr"><div>
      <label className="lbl">İlgili Görev (opsiyonel)</label>
      <select className="sel" value={f.linkedTask} onChange={e=>set('linkedTask',e.target.value)}>
        <option value="">— Görev Seç —</option>
        {teamTasks.map(t=>{
          const isSupport=(t.supportTeams||[]).includes(team?.name);
          return(<option key={t.id} value={t.name} title={t.name}>
            {isSupport?'🤝 ':'📌 '}{t.name.length>34?t.name.slice(0,34)+'…':t.name}{isSupport?` [${t.teamName}]`:''}
          </option>);
        })}
      </select>
    </div></div>}
    {members.length>0&&<div className="fr"><div><label className="lbl">Sorumlu (opsiyonel)</label><select className="sel" value={f.assignee} onChange={e=>set('assignee',e.target.value)}><option value="">— Kişi Seç —</option>{members.map(m=><option key={m.id} value={m.name} title={m.name}>{m.name.length>36?m.name.slice(0,36)+'…':m.name}</option>)}</select></div></div>}
    <div className="form-foot"><button className="btn btn-g" onClick={onClose}>İptal</button><button className="btn btn-p" onClick={submit}>{initial?'Güncelle':'Ekle'}</button></div>
  </div></div>);
}

/* ══ TEAM SECTION (Tracker) ═════════════════════════════ */
function TeamSection({team,items,onUpdateItem,onDeleteItem,onAddItem,onDeleteTeam,dragState,onDragStart,onDragEnd,onDrop,typeFilter,personFilter,projectTeams,projTasks}){
  const[open,setOpen]=useState(true);
  const[showAdd,setShowAdd]=useState(false);
  const[editItem,setEditItem]=useState(null);
  const[dOver,setDOver]=useState(null);
  const ti=items.filter(i=>i.teamId===team.id);
  const total=ti.length,done=ti.filter(i=>i.status==='done').length,pct=total>0?Math.round(done/total*100):0;
  const isC=pct===100&&total>0,tB=ti.filter(i=>i.type==='bug').length,dB=ti.filter(i=>i.type==='bug'&&i.status==='done').length;
  const handleUp=item=>{if(item._edit){const{_edit,...rest}=item;setEditItem(rest);return;}onUpdateItem(item);};
  const dropC=status=>{if(dragState.itemId)onDrop(dragState.itemId,team.id,status);setDOver(null);};
  return(<div className={`team-sec${isC?' done-t':''}`}>
    <div className={`team-hdr${open?' open-h':''}`} onClick={()=>setOpen(o=>!o)}>
      <div className="tname-cell"><span className={`acc-arr${open?' open':''}`}>▶</span><span title={team.name}>{isC?'🎉 ':''}{team.name}</span></div>
      <div className="tstat"><div className="tstat-v" style={{color:done===total&&total>0?'var(--green)':'var(--text)'}}>{done}/{total}</div><div className="tstat-l">Tamamlanan</div></div>
      <div className="tstat"><div className="tstat-v" style={{color:tB===0?'var(--text3)':dB===tB?'var(--green)':'var(--red)'}}>{dB}/{tB}</div><div className="tstat-l">Bug</div></div>
      <div className="tprog"><div className="pb-wrap" style={{flex:1}}><div className="pb-fill" style={{width:`${pct}%`,background:isC?'var(--green)':pct>60?'var(--accent)':'var(--accent2)'}}/></div><div className="tprog-pct" style={{color:isC?'var(--green)':'var(--text2)'}}>{pct}%</div></div>
      <div className="tdel-cell"><button className="ibtn r" onClick={e=>{e.stopPropagation();onDeleteTeam(team.id);}} title="Sil">×</button></div>
    </div>
    {open&&<div className="kb-board">{STATUSES.map(status=>{
      const ci=ti.filter(i=>i.status===status);
      const filtered=ci.filter(i=>{if(typeFilter!=='all'&&i.type!==typeFilter)return false;if(personFilter==='none'&&i.assignee)return false;if(personFilter&&personFilter!=='all'&&personFilter!=='none'&&i.assignee!==personFilter)return false;return true;});
      return(<div key={status} className="kb-col">
        <div className="kb-col-hdr"><span>{SL[status]}</span><span className="kb-cnt">{filtered.length}</span></div>
        <div className={`drop-z${dOver===status?' dov':''}`} onDragOver={e=>{e.preventDefault();setDOver(status);}} onDragLeave={()=>setDOver(null)} onDrop={()=>dropC(status)}>
          {ci.map(item=><KanbanItem key={item.id} item={item} onUpdate={handleUp} onDelete={onDeleteItem} onDragStart={onDragStart} onDragEnd={onDragEnd} isDragging={dragState.itemId===item.id} typeFilter={typeFilter} personFilter={personFilter}/>)}
        </div>
        {status==='todo'&&<button className="add-ki-btn" onClick={()=>setShowAdd(true)}>+ Ekle</button>}
      </div>);
    })}</div>}
    {showAdd&&<ItemModal teamId={team.id} projectTeams={projectTeams} projTasks={projTasks} onSave={form=>{onAddItem({id:uid(),...form,status:'todo',teamId:team.id,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),updatedBy:window.__un||'Kullanıcı'});setShowAdd(false);}} onClose={()=>setShowAdd(false)}/>}
    {editItem&&<ItemModal teamId={team.id} initial={editItem} projectTeams={projectTeams} projTasks={projTasks} onSave={form=>{onUpdateItem({...editItem,...form});setEditItem(null);}} onClose={()=>setEditItem(null)}/>}
  </div>);
}

/* ══ TRACKER TAB ════════════════════════════════════════ */
function TrackerTab({proj,updateProj}){
  const{teams,items,projectTeams=[],tasks=[]}=proj;
  const[newT,setNewT]=useState('');
  const[drag,setDrag]=useState({itemId:null});
  const[typeFilter,setTypeFilter]=useState('all');
  const[personFilter,setPersonFilter]=useState('all');
  const[teamFilt,setTeamFilt]=useState('all');
  const[gOpen,setGOpen]=useState(true);

  const addTeam=()=>{const n=newT.trim().slice(0,MAX_NAME);if(!n)return;const nt={id:uid(),name:n};updateProj(p=>({...p,teams:[...p.teams,nt],projectTeams:[...(p.projectTeams||[]),{...nt,members:[]}]}));setNewT('');};
  const delTeam=id=>{const nm=(teams.find(t=>t.id===id)||{}).name;updateProj(p=>({...p,teams:p.teams.filter(t=>t.id!==id),items:p.items.filter(i=>i.teamId!==id),projectTeams:(p.projectTeams||[]).filter(t=>t.id!==id),tasks:p.tasks.filter(t=>t.teamName!==nm)}));};
  const addItem=item=>updateProj(p=>({...p,items:[...p.items,item]}));
  const upItem=item=>updateProj(p=>({...p,items:p.items.map(i=>i.id===item.id?item:i)}));
  const delItem=id=>updateProj(p=>({...p,items:p.items.filter(i=>i.id!==id)}));
  const onDS=id=>setDrag({itemId:id}),onDE=()=>setDrag({itemId:null});
  const onDrop=(iid,toTeam,status)=>{updateProj(p=>({...p,items:p.items.map(i=>i.id===iid?{...i,teamId:toTeam,status,updatedAt:new Date().toISOString(),updatedBy:window.__un||'Kullanıcı'}:i)}));setDrag({itemId:null});};
  const doExport=()=>{const rows=items.map(i=>({'Ekip':teams.find(t=>t.id===i.teamId)?.name||'','Başlık':i.title,'Tür':i.type.toUpperCase(),'Statü':SL[i.status],'Görev':i.linkedTask||'','Sorumlu':i.assignee||'','Son Güncelleyen':i.updatedBy||'','Güncelleme':i.updatedAt?new Date(i.updatedAt).toLocaleString('tr-TR'):''}));const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Tracker');XLSX.writeFile(wb,`${proj.name}_tracker.xlsx`);};

  const doImportTracker=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'binary'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws);
        const newItems=rows.filter(r=>r['Başlık']).map(r=>{
          const teamName=String(r['Ekip']||'');
          const team=teams.find(t=>t.name===teamName)||teams[0];
          const statusMap={'TO DO':'todo','IN PROGRESS':'inprogress','IN REVIEW':'review','COMPLETED':'done'};
          const rawStatus=String(r['Statü']||'').toUpperCase();
          const status=statusMap[rawStatus]||'todo';
          return{id:uid(),title:String(r['Başlık']),type:String(r['Tür']||'TASK').toLowerCase()==='bug'?'bug':'task',status,teamId:team?.id||'',linkedTask:String(r['Görev']||''),assignee:String(r['Sorumlu']||''),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),updatedBy:window.__un||'Kullanıcı'};
        });
        if(newItems.length===0){alert('Geçerli öğe bulunamadı. "Başlık" sütununun dolu olduğundan emin olun.');return;}
        updateProj(p=>({...p,items:[...p.items,...newItems]}));
        alert(`${newItems.length} iş öğesi başarıyla içe aktarıldı.`);
      }catch(err){alert('Import hatası: '+err.message);}
    };
    reader.readAsBinaryString(file);
    e.target.value='';
  };

  const agg=useMemo(()=>{const total=items.length,done=items.filter(i=>i.status==='done').length,pct=total>0?Math.round(done/total*100):0,tB=items.filter(i=>i.type==='bug').length,dB=items.filter(i=>i.type==='bug'&&i.status==='done').length;return{total,done,pct,tB,dB};},[items]);
  const tStats=useMemo(()=>teams.map(team=>{const ti=items.filter(i=>i.teamId===team.id);const total=ti.length,done=ti.filter(i=>i.status==='done').length,pct=total>0?Math.round(done/total*100):0,tB=ti.filter(i=>i.type==='bug').length,dB=ti.filter(i=>i.type==='bug'&&i.status==='done').length;return{team,total,done,pct,tB,dB};}),[teams,items]);
  // Members with open item counts
  const usedMembers=useMemo(()=>{
    const names=new Set(items.filter(i=>i.assignee).map(i=>i.assignee));
    return[...names].map(name=>({
      name,
      open:items.filter(i=>i.assignee===name&&i.status!=='done').length
    }));
  },[items]);
  const visTeams=teamFilt==='all'?teams:teams.filter(t=>t.id===teamFilt);

  return(<div>
    {teams.length>0&&<div className="gsum">
      <div className={`gsum-hdr${gOpen?' open':''}`} onClick={()=>setGOpen(o=>!o)}>
        <span className={`acc-arr${gOpen?' open':''}`}>▶</span>
        <span className="gsum-title">Genel Özet</span>
        <span className="badge b-bl">{agg.done}/{agg.total}</span>
        {agg.tB>0&&<span className="badge b-rd" style={{marginLeft:4}}>{agg.dB}/{agg.tB} bug</span>}
        <div className="pb-wrap" style={{width:80,marginLeft:8}}><div className="pb-fill" style={{width:`${agg.pct}%`,background:agg.pct===100?'var(--green)':agg.pct>60?'var(--accent)':'var(--accent2)'}}/></div>
        <span style={{fontSize:'.72rem',fontFamily:'var(--fm)',color:agg.pct===100?'var(--green)':'var(--text2)',minWidth:34,marginLeft:6}}>{agg.pct}%</span>
      </div>
      {gOpen&&<div className="gsum-body">
        {tStats.map(({team,total,done,pct,tB,dB})=>(
          <div key={team.id} className="tsrow">
            <div className="tsrow-name" title={team.name}>{pct===100&&total>0?'🎉 ':''}{team.name}</div>
            <div className="tsrow-stats">
              <div className="tss"><div className="tdot tdot-g"/>{done}/{total}</div>
              {tB>0&&<div className="tss"><div className="tdot tdot-r"/>{dB}/{tB} bug</div>}
              <div className="pb-wrap" style={{width:70}}><div className="pb-fill" style={{width:`${pct}%`,background:pct===100?'var(--green)':pct>60?'var(--accent)':'var(--accent2)'}}/></div>
              <span style={{fontSize:'.7rem',fontFamily:'var(--fm)',color:pct===100?'var(--green)':'var(--text2)',minWidth:30}}>{pct}%</span>
            </div>
          </div>
        ))}
        <div className="tsrow" style={{borderTop:'1px solid var(--border)',paddingTop:8,marginTop:4}}>
          <div className="tsrow-name" style={{fontWeight:700}}>⬡ Toplam</div>
          <div className="tsrow-stats">
            <div className="tss"><div className="tdot tdot-g"/>{agg.done}/{agg.total}</div>
            {agg.tB>0&&<div className="tss"><div className="tdot tdot-r"/>{agg.dB}/{agg.tB} bug</div>}
            <div className="pb-wrap" style={{width:70}}><div className="pb-fill" style={{width:`${agg.pct}%`,background:agg.pct===100?'var(--green)':agg.pct>60?'var(--accent)':'var(--accent2)'}}/></div>
            <span style={{fontSize:'.7rem',fontFamily:'var(--fm)',color:agg.pct===100?'var(--green)':'var(--text2)',minWidth:30,fontWeight:700}}>{agg.pct}%</span>
          </div>
        </div>
      </div>}
    </div>}
    <div className="tk-top">
      <input className="inp" style={{maxWidth:200}} placeholder="Yeni ekip adı..." maxLength={MAX_NAME} value={newT} onChange={e=>setNewT(e.target.value.replace(/[^a-zA-Z0-9çÇğĞıİöÖşŞüÜ\s]/g,'').slice(0,MAX_NAME))} onKeyDown={e=>e.key==='Enter'&&addTeam()}/>
      <button className="btn btn-p" onClick={addTeam}>+ Ekip</button>
      {teams.length>1&&<select className="sel" style={{width:'auto',padding:'5px 8px',fontSize:'.8rem',maxWidth:140}} value={teamFilt} onChange={e=>setTeamFilt(e.target.value)}>
        <option value="all">Tüm Ekipler</option>
        {teams.map(t=><option key={t.id} value={t.id} title={t.name}>{t.name.length>16?t.name.slice(0,16)+'…':t.name}</option>)}
      </select>}
      <div style={{display:'flex',gap:4}}>{[['all','Tümü'],['task','Task'],['bug','Bug']].map(([v,l])=><button key={v} className={`fpill${typeFilter===v?' on':''}`} onClick={()=>setTypeFilter(v)}>{l}</button>)}</div>
      {usedMembers.length>0&&<select className="sel" style={{width:'auto',padding:'5px 8px',fontSize:'.8rem',maxWidth:160}} value={personFilter} onChange={e=>setPersonFilter(e.target.value)}>
        <option value="all">Tüm Kişiler</option>
        <option value="none">Atanmamış</option>
        {usedMembers.map(({name,open})=><option key={name} value={name} title={name}>{name.length>14?name.slice(0,14)+'…':name}{open>0?` (${open} açık)`:''}</option>)}
      </select>}
      {items.length>0&&<button className="btn btn-gr btn-sm" style={{marginLeft:'auto'}} onClick={doExport}>📊 Excel</button>}
      <label className="btn btn-or btn-sm" style={{cursor:'pointer',margin:0}}>
        📥 Import
        <input type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={doImportTracker}/>
      </label>
    </div>
    {teams.length===0?<div style={{textAlign:'center',padding:'48px 20px',color:'var(--text3)'}}><div style={{fontSize:'2rem',marginBottom:8}}>👥</div><div style={{fontFamily:'var(--fd)',fontWeight:600,color:'var(--text2)',marginBottom:4}}>Henüz ekip yok</div><div style={{fontSize:'.82rem'}}>Timeline veya buradan ekip ekleyin</div></div>
    :visTeams.map(team=><TeamSection key={team.id} team={team} items={items} onUpdateItem={upItem} onDeleteItem={delItem} onAddItem={addItem} onDeleteTeam={delTeam} dragState={drag} onDragStart={onDS} onDragEnd={onDE} onDrop={onDrop} typeFilter={typeFilter} personFilter={personFilter} projectTeams={projectTeams} projTasks={tasks}/>)}
  </div>);
}

/* ══ DASHBOARD ══════════════════════════════════════════ */
function Dashboard({projects,onSelect}){
  const today=todayStr();
  const info=projects.map(proj=>{
    const sc=computeSched(proj.tasks);
    const ps=pStart(sc),pe=pEnd(sc);
    const delay=pe&&proj.baselineEnd?Math.max(0,diffDays(proj.baselineEnd,pe)):0;
    const completedAt=proj.completedAt;
    const hasStarted=!!(ps&&ps<=today);
    // status for card grouping: completed > active (started, not completed) > not_started
    let status='not_started';
    if(completedAt)status='completed';
    else if(hasStarted)status='active'; // ALL started+non-completed projects = active
    else status='not_started';
    // isOverdue: non-completed project with baseline delay > 0
    const isOverdue=!completedAt&&delay>0;
    const tkTotal=proj.items?.length||0;
    const tkDone=(proj.items||[]).filter(i=>i.status==='done').length;
    const tkPct=tkTotal>0?Math.round(tkDone/tkTotal*100):0;
    const teamsCount=(proj.projectTeams||[]).length;
    return{proj,ps,pe,delay,completedAt,status,isOverdue,tkTotal,tkDone,tkPct,teamsCount,taskCount:proj.tasks.length};
  });

  const groups={
    active:info.filter(p=>p.status==='active'),
    not_started:info.filter(p=>p.status==='not_started'),
    completed:info.filter(p=>p.status==='completed'),
  };
  // Overdue count = non-completed projects with delay > 0
  const overdueCount=info.filter(p=>p.isOverdue).length;
  const totalDelay=info.filter(p=>p.isOverdue).reduce((s,p)=>s+p.delay,0);

  const STATUS_STRIP={active:'var(--green)',overdue:'var(--red)',not_started:'var(--text3)',completed:'var(--teal)'};
  const STATUS_LABEL={active:'Devam Ediyor',overdue:'Gecikmiş',not_started:'Başlamadı',completed:'Tamamlandı'};
  const STATUS_COLOR={active:'var(--green)',overdue:'var(--red)',not_started:'var(--text2)',completed:'var(--teal)'};

  function ProjCard({info}){
    const{proj,ps,pe,delay,completedAt,status,isOverdue,tkTotal,tkDone,tkPct,teamsCount,taskCount}=info;
    const cardColor=isOverdue&&!completedAt?'var(--red)':STATUS_STRIP[status];
    return(<div className="dash-card" onClick={()=>onSelect(proj.id)}>
      <div className="dash-card-strip" style={{background:cardColor}}/>
      <div className="dash-card-name">{proj.name}</div>
      <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:12}}>
        <div style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 9px',borderRadius:20,background:STATUS_STRIP[status]+'20',color:STATUS_COLOR[status],fontSize:'.68rem',fontWeight:700,border:`1px solid ${STATUS_STRIP[status]}30`}}>
          {status==='active'?'🟢':status==='not_started'?'⬜':'✅'} {STATUS_LABEL[status]}
        </div>
        {isOverdue&&!completedAt&&<div style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 9px',borderRadius:20,background:'var(--red-l)',color:'var(--red)',fontSize:'.68rem',fontWeight:700,border:'1px solid rgba(185,28,28,.2)'}}>
          🔴 Gecikmiş
        </div>}
      </div>
      <div className="dash-card-rows">
        <div className="dash-card-row"><span className="dash-card-row-lbl">Başlangıç</span><span className="dash-card-row-val">{ps?fmt(ps):'—'}</span></div>
        <div className="dash-card-row"><span className="dash-card-row-lbl">Planlanan Bitiş</span><span className="dash-card-row-val">{proj.baselineEnd?fmt(proj.baselineEnd):pe?fmt(pe):'—'}</span></div>
        {!completedAt&&delay>0&&<div className="dash-card-row"><span className="dash-card-row-lbl">Güncel Bitiş</span><span className="dash-card-row-val" style={{color:'var(--red)'}}>{fmt(pe)} <span style={{fontSize:'.67rem'}}>+{delay}g</span></span></div>}
        {completedAt&&<div className="dash-card-row"><span className="dash-card-row-lbl">Gerçek Bitiş</span><span className="dash-card-row-val" style={{color:'var(--teal)'}}>{fmt(completedAt)}</span></div>}
        <div className="dash-card-row"><span className="dash-card-row-lbl">Görev Sayısı</span><span className="dash-card-row-val">{taskCount}</span></div>
        <div className="dash-card-row"><span className="dash-card-row-lbl">Ekip Sayısı</span><span className="dash-card-row-val">{teamsCount}</span></div>
      </div>
      {tkTotal>0&&<div className="dash-card-pb">
        <div className="dash-card-pb-hdr"><span>Tracker İlerleme</span><span style={{fontFamily:'var(--fm)',fontSize:'.7rem'}}>{tkDone}/{tkTotal} ({tkPct}%)</span></div>
        <div className="pb-wrap" style={{height:6}}><div className="pb-fill" style={{width:`${tkPct}%`,background:tkPct===100?'var(--green)':tkPct>60?'var(--accent)':'var(--accent2)'}}/></div>
      </div>}
    </div>);
  }

  const orderedGroups=[
    {key:'active',label:'🟢 Devam Eden',color:'var(--green)',items:groups.active},
    {key:'not_started',label:'⬜ Henüz Başlamadı',color:'var(--text2)',items:groups.not_started},
    {key:'completed',label:'✅ Tamamlanan',color:'var(--teal)',items:groups.completed},
  ];

  return(<div>
    {/* Hero stats - 5 cards: total, active, delayed, not-started, completed */}
    <div className="dash-hero">
      <div className="dash-hero-card dhc-total">
        <div style={{fontSize:'.72rem',color:'var(--text2)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em'}}>Toplam Proje</div>
        <div className="dhc-val" style={{color:'var(--accent)'}}>{projects.length}</div>
        <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:4}}>tüm projeler</div>
      </div>
      <div className="dash-hero-card dhc-active">
        <div style={{fontSize:'.72rem',color:'var(--text2)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em'}}>Aktif</div>
        <div className="dhc-val" style={{color:'var(--green)'}}>{groups.active.length}</div>
        <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:4}}>devam ediyor</div>
      </div>
      <div className="dash-hero-card dhc-delayed">
        <div style={{fontSize:'.72rem',color:'var(--text2)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em'}}>Gecikmiş</div>
        <div className="dhc-val" style={{color:'var(--red)'}}>{overdueCount}</div>
        <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:4}}>{totalDelay>0?`+${totalDelay}g toplam`:overdueCount===0?'sorun yok':'dikkat!'}</div>
      </div>
      <div className="dash-hero-card dhc-notstart">
        <div style={{fontSize:'.72rem',color:'var(--text2)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em'}}>Başlamadı</div>
        <div className="dhc-val" style={{color:'var(--text2)'}}>{groups.not_started.length}</div>
        <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:4}}>planlanıyor</div>
      </div>
      <div className="dash-hero-card dhc-done">
        <div style={{fontSize:'.72rem',color:'var(--text2)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em'}}>Tamamlanan</div>
        <div className="dhc-val" style={{color:'var(--teal)'}}>{groups.completed.length}</div>
        <div style={{fontSize:'.72rem',color:'var(--text3)',marginTop:4}}>sonlandırıldı</div>
      </div>
    </div>
    {/* Groups */}
    {orderedGroups.map(g=>g.items.length>0&&(
      <div key={g.key} className="dash-section">
        <div className="dash-section-hdr">
          <span className="dash-section-title" style={{color:g.color}}>{g.label}</span>
          <span className="dash-section-count">({g.items.length})</span>
        </div>
        <div className="dash-grid">{g.items.map(i=><ProjCard key={i.proj.id} info={i}/>)}</div>
      </div>
    ))}
    {projects.length===0&&<div style={{textAlign:'center',padding:'80px 20px'}}>
      <div style={{fontSize:'3.5rem',marginBottom:16}}>🚀</div>
      <div style={{fontFamily:'var(--fd)',fontWeight:700,color:'var(--text)',fontSize:'1.4rem',marginBottom:8}}>Hoş geldiniz!</div>
      <div style={{fontSize:'.9rem',color:'var(--text2)',marginBottom:24,lineHeight:1.6,maxWidth:340,margin:'0 auto 24px'}}>Proje takibine başlamak için ilk projenizi oluşturun. Ekip, görev ve Gantt şeması hepsi burada.</div>
      <button className="btn btn-p" style={{fontSize:'1rem',padding:'10px 24px'}} onClick={()=>{const ev=new CustomEvent('pf-new-proj');window.dispatchEvent(ev);}}>+ İlk Projeyi Oluştur</button>
      <div style={{marginTop:32,display:'flex',justifyContent:'center',gap:24,flexWrap:'wrap'}}>
        {[['📅','Timeline & Gantt','Görev ve tarihleri planlayın'],['👥','Ekip Yönetimi','Ekip ve üye tanımı yapın'],['📌','Tracker','Kanban ile iş takibi yapın']].map(([ic,t,d])=>(
          <div key={t} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:'16px',width:160,textAlign:'center',boxShadow:'var(--sh-sm)'}}>
            <div style={{fontSize:'1.6rem',marginBottom:6}}>{ic}</div>
            <div style={{fontWeight:600,fontSize:'.82rem',marginBottom:4}}>{t}</div>
            <div style={{fontSize:'.72rem',color:'var(--text3)'}}>{d}</div>
          </div>
        ))}
      </div>
    </div>}
  </div>);
}

/* ══ SHARE / PROJECT MODALS ═════════════════════════════ */
function ShareModal({proj,onClose}){
  const[c,setC]=useState(false);
  // Generate share URL using shareKey (not encoded project data)
  const shareKey=proj.shareKey||proj.id;
  const url=`${location.origin}${location.pathname}?key=${shareKey}`;
  const copy=()=>{navigator.clipboard.writeText(url).then(()=>{setC(true);setTimeout(()=>setC(false),2500);});};
  return(<div className="mbd"><div className="modal modal-sm">
    <div className="modal-title">🔗 Projeyi Paylaş</div>
    <p style={{fontSize:'.83rem',color:'var(--text2)',marginBottom:14,lineHeight:1.55}}>Bu bağlantıyı paylaştığınız kişiler <strong>yalnızca bu projeyi</strong> görür ve düzenleyebilir. Değişiklikler anlık olarak senkronize edilir.</p>
    <div className="share-url">{url}</div>
    <div style={{marginTop:10,fontSize:'.72rem',color:'var(--text3)'}}>ℹ️ Linki alan kişi diğer projelerinizi göremez.</div>
    <div className="form-foot"><button className="btn btn-g" onClick={onClose}>Kapat</button><button className="btn btn-p" onClick={copy}>{c?'✓ Kopyalandı!':'📋 Kopyala'}</button></div>
  </div></div>);
}

function ProjectModal({onSave,onClose}){const[name,setName]=useState('');const submit=()=>{if(!name.trim())return;onSave(name.trim());};
return(<div className="mbd"><div className="modal modal-sm"><div className="modal-title">Yeni Proje</div><div className="fr"><div><label className="lbl">Proje Adı *</label><input className="inp" placeholder="Örn: Mobil Uygulama" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} autoFocus/></div></div><div className="form-foot"><button className="btn btn-g" onClick={onClose}>İptal</button><button className="btn btn-p" onClick={submit}>Oluştur</button></div></div></div>);}

function WelcomeScreen({onEnter}){const[name,setName]=useState('');const enter=()=>{if(!name.trim())return;onEnter(name.trim());};
return(<div className="wscreen"><div className="wbox"><div className="wlogo">Project<em>Flow</em></div><div style={{fontSize:'.9rem',color:'var(--text2)',marginBottom:30}}>Ekip tabanlı proje takip sistemi</div><label className="lbl" style={{textAlign:'left',display:'block',marginBottom:6}}>Adınız *</label><input className="inp" placeholder="Adınızı girin..." value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&enter()} autoFocus style={{marginBottom:14}}/><button className="btn btn-p" style={{width:'100%',justifyContent:'center',padding:10}} onClick={enter}>Başla →</button><div style={{marginTop:14,fontSize:'.72rem',color:'var(--text3)'}}>Verileriniz bu tarayıcıda saklanır</div></div></div>);}

function ProjName({name,onRename,active}){const[editing,setEditing]=useState(false);const[val,setVal]=useState(name);const ref=useRef(null);useEffect(()=>setVal(name),[name]);useEffect(()=>{if(editing&&ref.current)ref.current.focus();},[editing]);const commit=()=>{if(val.trim())onRename(val.trim());setEditing(false);};
if(active&&editing)return<span onClick={e=>e.stopPropagation()}><input ref={ref} className="pname-inp" value={val} onChange={e=>setVal(e.target.value)} onBlur={commit} onKeyDown={e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){setVal(name);setEditing(false);}}} style={{width:Math.max(60,val.length*9)+'px'}}/></span>;
return<span className="pchip-name" onDoubleClick={()=>active&&setEditing(true)} title={active?`${name} (çift tıkla: yeniden adlandır)`:name}>{name}{active&&<span style={{marginLeft:3,fontSize:'.6rem',color:'var(--text3)',opacity:.5}}>✎</span>}</span>;}

/* ══ APP ════════════════════════════════════════════════ */
// localStorage key for owned project IDs
const OWNED_KEY='pf_owned_v1';
const loadOwned=()=>{try{return JSON.parse(localStorage.getItem(OWNED_KEY)||'[]');}catch{return [];}};
const saveOwned=ids=>{try{localStorage.setItem(OWNED_KEY,JSON.stringify(ids));}catch{}};

function App(){
  // Detect if opened via share link (?key=xxx)
  const urlParams=new URLSearchParams(location.search);
  const shareKeyParam=urlParams.get('key');
  const isGuestMode=!!shareKeyParam; // guest = opened via share link

  const[state,setRaw]=useState(()=>loadAll()||defState());
  const[syncStatus,setSyncStatus]=useState('idle');
  const[loaded,setLoaded]=useState(false);
  const[guestProj,setGuestProj]=useState(null); // the single shared project for guest
  const[guestLoading,setGuestLoading]=useState(isGuestMode);
  const ignoreNextRemote=useRef(new Set());

  const setState=useCallback(fn=>{
    setRaw(prev=>{
      const next=typeof fn==='function'?fn(prev):fn;
      saveAll(next);
      return next;
    });
  },[]);

  const sbSync=useCallback(async(proj)=>{
    setSyncStatus('syncing');
    ignoreNextRemote.current.add(proj.id);
    await sbSaveProj(proj);
    setSyncStatus('ok');
    setTimeout(()=>setSyncStatus('idle'),2000);
  },[]);

  const setStateAndSync=useCallback(fn=>{
    setRaw(prev=>{
      const next=typeof fn==='function'?fn(prev):fn;
      saveAll(next);
      const changed=next.projects.filter(np=>{
        const op=prev.projects.find(p=>p.id===np.id);
        return !op||JSON.stringify(op)!==JSON.stringify(np);
      });
      changed.forEach(p=>sbSync(p));
      return next;
    });
  },[sbSync]);

  // For guest mode: update guestProj and sync
  const updateGuestProj=useCallback(fn=>{
    setGuestProj(prev=>{
      const next=typeof fn==='function'?fn(prev):fn;
      if(next)sbSync(next);
      return next;
    });
  },[sbSync]);

  const{userName,projects,activeProjId,activeTab}=state;
  window.__un=userName;

  // ── GUEST MODE: load single project by shareKey ─────────
  useEffect(()=>{
    if(!isGuestMode)return;
    (async()=>{
      setGuestLoading(true);
      const proj=await sbLoadByShareKey(shareKeyParam);
      setGuestProj(proj);
      setGuestLoading(false);
    })();
  },[]);

  // ── OWNER MODE: load owned projects from Supabase ───────
  useEffect(()=>{
    if(isGuestMode)return;
    (async()=>{
      setSyncStatus('syncing');
      const ownedIds=loadOwned();
      const localState=loadAll()||defState();
      const localProjs=localState.projects;

      // Ensure all local projects have a shareKey (migrate old projects)
      const migratedLocal=localProjs.map(p=>p.shareKey?p:{...p,shareKey:uid()+uid()});
      const allIds=[...new Set([...ownedIds,...migratedLocal.map(p=>p.id)])];

      if(allIds.length>0){
        const remoteProjs=await sbLoadAll(allIds);
        if(remoteProjs&&remoteProjs.length>0){
          setRaw(prev=>{
            const localOnly=prev.projects.filter(lp=>!remoteProjs.find(rp=>rp.id===lp.id));
            // Ensure remote projects also have shareKey
            const remoteWithKey=remoteProjs.map(p=>p.shareKey?p:{...p,shareKey:uid()+uid()});
            const merged=[...remoteWithKey,...localOnly];
            const next={...prev,projects:merged};
            saveAll(next);
            return next;
          });
        } else {
          // No remote data - use migrated local, save them all to Supabase
          setRaw(prev=>{
            const next={...prev,projects:migratedLocal};
            saveAll(next);
            return next;
          });
          // Push all local projects to Supabase
          for(const p of migratedLocal) await sbSaveProj(p);
        }
      }
      setSyncStatus('ok');
      setTimeout(()=>setSyncStatus('idle'),2000);
      setLoaded(true);
    })();
  },[]);

  // ── Auto-complete ───────────────────────────────────────
  useEffect(()=>{
    if(!loaded||isGuestMode)return;
    const today=todayStr();
    setStateAndSync(s=>{
      let changed=false;
      const updated=s.projects.map(p=>{
        if(p.completedAt)return p;
        if(!p.tasks||p.tasks.length===0)return p;
        const sc=computeSched(p.tasks);
        const pe=pEnd(sc);
        if(pe&&pe<today){changed=true;return{...p,completedAt:pe};}
        return p;
      });
      if(!changed)return s;
      return{...s,projects:updated};
    });
  },[loaded]);

  // ── Realtime subscription ───────────────────────────────
  useEffect(()=>{
    const channel=sb.channel('projects-rt-v2')
      .on('postgres_changes',{event:'*',schema:'public',table:'projects'},payload=>{
        const{eventType,new:row,old}=payload;
        if(eventType==='DELETE'){
          const did=old?.id;
          if(!did)return;
          if(isGuestMode){if(guestProj?.id===did)setGuestProj(null);}
          else setRaw(prev=>{const rem=prev.projects.filter(p=>p.id!==did);const next={...prev,projects:rem,activeProjId:prev.activeProjId===did?(rem[0]?.id||null):prev.activeProjId};saveAll(next);return next;});
          return;
        }
        const incoming=row?.data;
        if(!incoming?.id)return;
        if(ignoreNextRemote.current.has(incoming.id)){ignoreNextRemote.current.delete(incoming.id);return;}
        if(isGuestMode){
          // Guest: only update if this is the shared project
          if(incoming.id===guestProj?.id||incoming.shareKey===shareKeyParam)setGuestProj(incoming);
        } else {
          // Owner: only update if this is one of our projects
          setRaw(prev=>{
            if(!prev.projects.some(p=>p.id===incoming.id))return prev; // not our project, ignore
            const updated=prev.projects.map(p=>p.id===incoming.id?incoming:p);
            const next={...prev,projects:updated};
            saveAll(next);
            return next;
          });
        }
      })
      .subscribe();
    return()=>{sb.removeChannel(channel);};
  },[isGuestMode,guestProj?.id]);

  // ── Save owned IDs when projects change ─────────────────
  useEffect(()=>{
    if(isGuestMode)return;
    saveOwned(projects.map(p=>p.id));
  },[projects,isGuestMode]);

  const[showNewProj,setShowNewProj]=useState(false);
  const[showShare,setShowShare]=useState(false);
  const[confirmDel,setConfirmDel]=useState(null);

  useEffect(()=>{
    const h=()=>setShowNewProj(true);
    window.addEventListener('pf-new-proj',h);
    return()=>window.removeEventListener('pf-new-proj',h);
  },[]);

  const apid=activeProjId||(projects.length>0?projects[0]?.id:null);
  const proj=projects.find(p=>p.id===apid)||null;

  const updProj=fn=>setStateAndSync(s=>({...s,projects:s.projects.map(p=>p.id===apid?(typeof fn==='function'?fn(p):fn):p)}));
  const setTab=t=>setState(s=>({...s,activeTab:t}));

  const addProject=name=>{
    const np=defProj(name);
    setStateAndSync(s=>({...s,projects:[...s.projects,np],activeProjId:np.id,activeTab:'timeline'}));
    setShowNewProj(false);
  };
  const deleteProject=id=>{
    setRaw(s=>{const rem=s.projects.filter(p=>p.id!==id);const next={...s,projects:rem,activeProjId:rem.length>0?rem[rem.length-1].id:null,activeTab:'dashboard'};saveAll(next);return next;});
    sbDeleteProj(id);
    setConfirmDel(null);
  };
  const renameProj=(id,name)=>setStateAndSync(s=>({...s,projects:s.projects.map(p=>p.id===id?{...p,name}:p)}));
  const selectProject=id=>setState(s=>({...s,activeProjId:id,activeTab:'timeline'}));
  const goDash=()=>setState(s=>({...s,activeTab:'dashboard',activeProjId:null}));

  const syncLabel=syncStatus==='syncing'?'Senkronize ediliyor...':syncStatus==='ok'?'Senkronize edildi':syncStatus==='error'?'Bağlantı hatası':'Canlı';
  const syncClass=syncStatus==='syncing'?'syncing':syncStatus==='error'?'error':'';

  // ── GUEST MODE RENDER ───────────────────────────────────
  if(isGuestMode){
    if(guestLoading)return<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:12,color:'var(--text2)'}}><div style={{width:36,height:36,border:'3px solid var(--border)',borderTop:'3px solid var(--accent)',borderRadius:'50%',animation:'spin 1s linear infinite'}}/><div style={{fontSize:'.9rem'}}>Proje yükleniyor...</div><style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style></div>;
    if(!guestProj)return<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:12,color:'var(--text2)'}}><div style={{fontSize:'2rem'}}>🔒</div><div style={{fontFamily:'var(--fd)',fontWeight:700,fontSize:'1.1rem',color:'var(--text)'}}>Proje bulunamadı</div><div style={{fontSize:'.85rem'}}>Bu paylaşım linki geçersiz veya proje silinmiş olabilir.</div></div>;
    if(!userName)return<WelcomeScreen onEnter={name=>setState(s=>({...s,userName:name}))}/>;
    const isDash2=false;
    const guestTab=activeTab==='tracker'?'tracker':'timeline';
    return(<div className="app">
      <header className="hdr">
        <div className="logo"><div className="lm">PF</div>ProjectFlow</div>
        <div className="hdr-tabs">
          <button className={`htab${guestTab==='timeline'?' on':''}`} onClick={()=>setTab('timeline')}>📅 Timeline</button>
          <button className={`htab${guestTab==='tracker'?' on':''}`} onClick={()=>setTab('tracker')}>📌 Tracker</button>
        </div>
        <div className="hdr-r">
          <div className="sync-chip" title={syncLabel}><div className={`sync-dot ${syncClass}`}/><span>{syncLabel}</span></div>
          <div className="dchip">📅 {fmtFull(todayStr())}</div>
          <div className="uchip" title="Tıkla değiştir" onClick={()=>setState(s=>({...s,userName:''}))}>
            <div className="uav">{userName.slice(0,2).toUpperCase()}</div>{userName}
          </div>
        </div>
      </header>
      <div className="pbar">
        <button className="pchip on"><span className="pchip-name">{guestProj.name}</span></button>
        <span style={{fontSize:'.72rem',color:'var(--text3)',padding:'0 10px',alignSelf:'center'}}>🔗 Paylaşılan proje</span>
      </div>
      <main className="main">
        {guestTab==='timeline'&&<TimelineTab proj={guestProj} updateProj={updateGuestProj}/>}
        {guestTab==='tracker'&&<TrackerTab proj={guestProj} updateProj={updateGuestProj}/>}
      </main>
    </div>);
  }

  // ── OWNER MODE RENDER ───────────────────────────────────
  if(!userName)return<WelcomeScreen onEnter={name=>setState(s=>({...s,userName:name}))}/>;
  const isDash=activeTab==='dashboard';

  return(<div className="app">
    <header className="hdr">
      <div className="logo"><div className="lm">PF</div>ProjectFlow</div>
      <div className="hdr-tabs">
        <button className={`htab${isDash?' on':''}`} onClick={goDash}>🏠 Dashboard</button>
        {!isDash&&<>
          <button className={`htab${activeTab==='timeline'?' on':''}`} onClick={()=>setTab('timeline')}>📅 Timeline</button>
          <button className={`htab${activeTab==='tracker'?' on':''}`} onClick={()=>setTab('tracker')}>📌 Tracker</button>
        </>}
      </div>
      <div className="hdr-r">
        <div className="sync-chip" title={syncLabel}><div className={`sync-dot ${syncClass}`}/><span>{syncLabel}</span></div>
        {proj&&!isDash&&<button className="btn btn-sh btn-sm" onClick={()=>setShowShare(true)}>🔗 Paylaş</button>}
        <div className="dchip">📅 {fmtFull(todayStr())}</div>
        <div className="uchip" title="Tıkla değiştir" onClick={()=>setState(s=>({...s,userName:''}))}>
          <div className="uav">{userName.slice(0,2).toUpperCase()}</div>{userName}
        </div>
      </div>
    </header>
    {!isDash&&<div className="pbar">
      {projects.map(p=><button key={p.id} className={`pchip${p.id===apid?' on':''}`} onClick={()=>setState(s=>({...s,activeProjId:p.id,activeTab:'timeline'}))}>
        <ProjName name={p.name} active={p.id===apid} onRename={name=>renameProj(p.id,name)}/>
        <span className="proj-del-btn" onClick={e=>{e.stopPropagation();setConfirmDel(p.id);}} title="Projeyi sil">×</span>
      </button>)}
      <button className="pchip ap" onClick={()=>setShowNewProj(true)}>+ Yeni Proje</button>
    </div>}
    <main className="main">
      {isDash&&<>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24}}>
          <div><div style={{fontFamily:'var(--fd)',fontWeight:800,fontSize:'1.6rem',letterSpacing:'-.03em',color:'var(--text)'}}>Dashboard</div><div style={{fontSize:'.83rem',color:'var(--text2)',marginTop:2}}>Tüm projelerinizin özet görünümü</div></div>
          <button className="btn btn-p" onClick={()=>setShowNewProj(true)}>+ Yeni Proje</button>
        </div>
        <Dashboard projects={projects} onSelect={selectProject}/>
      </>}
      {!isDash&&proj&&activeTab==='timeline'&&<TimelineTab proj={proj} updateProj={updProj}/>}
      {!isDash&&proj&&activeTab==='tracker'&&<TrackerTab proj={proj} updateProj={updProj}/>}
    </main>
    {showNewProj&&<ProjectModal onSave={addProject} onClose={()=>setShowNewProj(false)}/>}
    {showShare&&proj&&<ShareModal proj={proj} onClose={()=>setShowShare(false)}/>}
    {confirmDel&&<ConfirmModal title="Projeyi Sil" message={`"${projects.find(p=>p.id===confirmDel)?.name}" projesini ve tüm verilerini silmek istediğinizden emin misiniz?`} onConfirm={()=>deleteProject(confirmDel)} onCancel={()=>setConfirmDel(null)}/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
