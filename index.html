<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ProjectFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#f4f3ef;--surface:#fff;--surface2:#f8f7f4;--surface3:#eeecea;
  --border:#e3e1d8;--border2:#cec9bc;
  --text:#18170f;--text2:#6a6555;--text3:#a09888;
  --accent:#2355d4;--accent-l:#eef2ff;--accent2:#6d28d9;
  --green:#047857;--green-l:#ecfdf5;--green-m:#d1fae5;
  --red:#b91c1c;--red-l:#fef2f2;--red-m:#fee2e2;
  --yellow:#92400e;--yellow-l:#fffbeb;--yellow-m:#fde68a;
  --orange:#9a3412;--orange-l:#fff7ed;--orange-m:#fed7aa;
  --teal:#0e7490;--teal-l:#ecfeff;--teal-m:#cffafe;
  --purple:#5b21b6;--purple-l:#f5f3ff;
  --gray:#4b5563;--gray-l:#f3f4f6;
  --r:8px;--rl:12px;
  --sh-sm:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --sh:0 4px 16px rgba(0,0,0,.09),0 2px 6px rgba(0,0,0,.04);
  --sh-lg:0 12px 40px rgba(0,0,0,.13),0 4px 12px rgba(0,0,0,.06);
  --fd:'Fraunces',Georgia,serif;--fb:'DM Sans',system-ui,sans-serif;--fm:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh}
input,select,button,textarea{font-family:var(--fb)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.app{display:flex;flex-direction:column;min-height:100vh}
/* ─ HEADER ─────────────────────────────────────────────── */
.hdr{display:flex;align-items:center;padding:0 24px;height:56px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:300;gap:12px;box-shadow:var(--sh-sm)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:1.15rem;color:var(--text);letter-spacing:-.02em;flex-shrink:0}
.lm{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:.7rem;font-weight:700;flex-shrink:0}
.hdr-tabs{display:flex;gap:2px;background:var(--surface3);border:1px solid var(--border);border-radius:var(--r);padding:3px}
.htab{padding:5px 14px;border:none;border-radius:6px;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .18s;color:var(--text2);background:transparent;white-space:nowrap}
.htab.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-sm);font-weight:600}
.hdr-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.dchip{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text2);font-size:.72rem;font-family:var(--fm)}
.uchip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:.8rem;color:var(--text2);transition:all .15s}
.uchip:hover{border-color:var(--border2);color:var(--text)}
.uav{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:.63rem;font-weight:700;flex-shrink:0}
/* ─ PROJECT BAR ─────────────────────────────────────────── */
.pbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;overflow-x:auto;min-height:44px}
.pchip{padding:10px 12px;border:none;background:transparent;color:var(--text2);font-size:.82rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:5px;max-width:180px}
.pchip:hover{color:var(--text)}.pchip.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.pchip-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.pchip.ap{color:var(--text3);font-size:.8rem;max-width:none}.pchip.ap:hover{color:var(--accent)}
.pname-inp{border:none;background:transparent;font-family:var(--fb);font-size:.82rem;font-weight:600;color:var(--accent);outline:none;min-width:60px;max-width:160px;padding:0}
.proj-del-btn{opacity:0;width:16px;height:16px;border-radius:50%;border:none;background:var(--red-l);color:var(--red);font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.pchip:hover .proj-del-btn{opacity:1}.proj-del-btn:hover{background:var(--red);color:#fff}
/* ─ MAIN ─────────────────────────────────────────────────── */
.main{flex:1;padding:24px}
/* ─ BUTTONS ──────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--r);font-weight:500;font-size:.83rem;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:#1a45c0;box-shadow:0 2px 8px rgba(35,85,212,.3)}
.btn-p:disabled{background:var(--border2);color:var(--text3);cursor:not-allowed;box-shadow:none}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-g:hover{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.btn-gr{background:var(--green-l);color:var(--green);border:1px solid rgba(4,120,87,.25)}.btn-gr:hover{background:var(--green-m)}
.btn-sh{background:var(--yellow-l);color:var(--yellow);border:1px solid rgba(146,64,14,.2)}.btn-sh:hover{background:var(--yellow-m)}
.btn-tl{background:var(--teal-l);color:var(--teal);border:1px solid rgba(14,116,144,.2)}.btn-tl:hover{background:var(--teal-m)}
.btn-rd{background:var(--red-l);color:var(--red);border:1px solid rgba(185,28,28,.2)}.btn-rd:hover{background:var(--red-m)}
.btn-or{background:var(--orange-l);color:var(--orange);border:1px solid rgba(154,52,18,.2)}.btn-or:hover{background:var(--orange-m)}
.btn-sm{padding:5px 10px;font-size:.78rem}
.ibtn{width:26px;height:26px;border-radius:6px;border:none;background:transparent;color:var(--text3);cursor:pointer;display:grid;place-items:center;font-size:.8rem;transition:all .15s;flex-shrink:0}
.ibtn:hover{background:var(--surface3);color:var(--text)}.ibtn.r:hover{background:var(--red-l);color:var(--red)}.ibtn.b:hover{background:var(--accent-l);color:var(--accent)}
/* ─ INPUTS ──────────────────────────────────────────────── */
.inp,.sel{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--r);padding:8px 11px;font-size:.85rem;outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
.inp:focus,.sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(35,85,212,.1)}
.inp::placeholder{color:var(--text3)}.sel option{background:var(--surface)}
.lbl{font-size:.75rem;color:var(--text2);font-weight:500;margin-bottom:4px;display:block}
.seg-ctrl{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.seg-btn{flex:1;padding:7px 12px;border:none;background:transparent;color:var(--text2);font-size:.82rem;cursor:pointer;transition:all .14s}
.seg-btn.on{background:var(--accent);color:#fff}
/* ─ MODAL ────────────────────────────────────────────────── */
.mbd{position:fixed;inset:0;background:rgba(15,14,10,.38);backdrop-filter:blur(6px);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .15s ease}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:24px;width:480px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:su .2s ease}
.modal.modal-flex{overflow:hidden;display:flex;flex-direction:column;height:min(80vh,600px)}
.modal-sm{width:380px}.modal-lg{width:720px;max-width:96vw}
.modal-title{font-family:var(--fd);font-weight:700;font-size:1.1rem;margin-bottom:18px}
.fr{display:grid;gap:12px;margin-bottom:12px}.fr2{grid-template-columns:1fr 1fr}
.form-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
/* ─ BANNERS ──────────────────────────────────────────────── */
.banner{border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:.83rem;font-weight:500;margin-bottom:14px}
.bn-d{background:var(--red-l);border:1px solid rgba(185,28,28,.2);color:var(--red)}
.bn-ok{background:var(--green-l);border:1px solid rgba(4,120,87,.2);color:var(--green)}
.bn-i{background:var(--accent-l);border:1px solid rgba(35,85,212,.15);color:var(--accent)}
.bn-w{background:var(--yellow-l);border:1px solid rgba(146,64,14,.2);color:var(--yellow)}
.bn-tl{background:var(--teal-l);border:1px solid rgba(14,116,144,.2);color:var(--teal)}
.bn-or{background:var(--orange-l);border:1px solid rgba(154,52,18,.2);color:var(--orange)}
/* ─ COLLAPSIBLE PANEL ───────────────────────────────────── */
.cpanel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--sh-sm);margin-bottom:10px;overflow:hidden}
.cpanel-hdr{display:flex;align-items:center;padding:11px 15px;cursor:pointer;user-select:none;gap:8px;transition:background .12s;border-bottom:1px solid transparent}
.cpanel-hdr:hover{background:var(--surface2)}.cpanel-hdr.oh{border-bottom-color:var(--border)}
.cpanel-title{font-weight:600;font-size:.85rem;flex:1}
.carrow{font-size:.65rem;color:var(--text3);transition:transform .2s;flex-shrink:0}
.carrow.open{transform:rotate(90deg)}
/* ─ ACCORDION ───────────────────────────────────────────── */
.acc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh-sm)}
.acc-hdr{display:flex;align-items:center;padding:12px 16px;cursor:pointer;user-select:none;gap:8px;transition:background .12s}
.acc-hdr:hover{background:var(--surface2)}
.acc-arr{font-size:.65rem;color:var(--text3);transition:transform .2s;flex-shrink:0}
.acc-arr.open{transform:rotate(90deg)}
.acc-body{border-top:1px solid var(--border)}
/* ─ SUMMARY CARDS ───────────────────────────────────────── */
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;box-shadow:var(--sh-sm)}
.scard-val{font-family:var(--fd);font-size:1.4rem;font-weight:700;line-height:1}
.scard-lbl{font-size:.72rem;color:var(--text2);margin-top:4px}
.scard-sub{font-size:.68rem;font-family:var(--fm);color:var(--text3);margin-top:2px}
/* ─ TEAM SUMMARY TABLE ───────────────────────────────────── */
.team-sum-table{width:100%;border-collapse:collapse;font-size:.78rem}
.team-sum-table th{font-size:.68rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:7px 10px;border-bottom:2px solid var(--border);text-align:right;white-space:nowrap}
.team-sum-table th:first-child{text-align:left}
.team-sum-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;text-align:right}
.team-sum-table td:first-child{text-align:left}
.team-sum-table tr:last-child td{border-bottom:none}
.team-sum-table tr:hover td{background:var(--surface2)}
.ts-name{font-weight:700;font-size:.82rem;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.ts-num{font-family:var(--fm);font-size:.78rem;white-space:nowrap;font-weight:500}
.ts-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:5px;font-size:.68rem;font-family:var(--fm);font-weight:600;white-space:nowrap}
.ts-ok{background:var(--green-l);color:var(--green)}
.ts-warn{background:var(--orange-l);color:var(--orange)}
.ts-delay{background:var(--red-l);color:var(--red)}
.ts-neutral{background:var(--surface3);color:var(--text2)}
.ts-sub{font-size:.65rem;color:var(--text3);display:block;margin-top:1px;font-family:var(--fm)}
/* ─ BADGES ──────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;font-size:.65rem;font-family:var(--fm);font-weight:600}
.b-bl{background:var(--accent-l);color:var(--accent)}.b-gr{background:var(--green-l);color:var(--green)}
.b-rd{background:var(--red-l);color:var(--red)}.b-yl{background:var(--yellow-l);color:var(--yellow)}
.b-gy{background:var(--surface3);color:var(--text2)}.b-tl{background:var(--teal-l);color:var(--teal)}
.b-or{background:var(--orange-l);color:var(--orange)}.b-pu{background:var(--purple-l);color:var(--purple)}
.divider{height:1px;background:var(--border);margin:12px 0}
/* ─ GANTT ─────────────────────────────────────────────────── */
.gl-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.task-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 15px;box-shadow:var(--sh-sm)}
.panel-hdr{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ph-title{font-weight:600;font-size:.85rem;flex:1}
.task-list{display:flex;flex-direction:column;gap:5px;max-height:340px;overflow-y:auto;padding-right:2px}
.titem{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;display:flex;flex-direction:column;gap:3px;transition:all .15s}
.titem:hover{border-color:var(--border2);box-shadow:var(--sh-sm)}
.titem.delayed{border-color:rgba(185,28,28,.4);background:var(--red-l)}
.titem.extended{border-color:rgba(154,52,18,.4);background:var(--orange-l)}
.titem.new-after-bl{border-color:rgba(35,85,212,.3);background:var(--accent-l)}
.titem-top{display:flex;align-items:flex-start;gap:5px}
.titem-num{font-family:var(--fm);font-size:.68rem;color:var(--text3);width:18px;flex-shrink:0;padding-top:2px;text-align:right}
.titem-body{flex:1;min-width:0}
.titem-name{font-weight:600;font-size:.83rem;word-break:break-word;line-height:1.35}
.titem-team{font-size:.67rem;font-family:var(--fm);color:var(--accent);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.titem-meta{font-size:.7rem;color:var(--text2);margin-top:2px;font-family:var(--fm)}
.titem-flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.titem-actions{display:flex;gap:2px;flex-shrink:0}
/* GANTT TABLE */
.gantt-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh-sm)}
.gantt-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap;background:var(--surface2)}
.gtable{border-collapse:collapse;table-layout:fixed}
.mrow th{background:var(--surface3);border-bottom:1px solid var(--border);font-size:.65rem;font-weight:700;font-family:var(--fm);color:var(--text2);letter-spacing:.05em;padding:4px 0;text-align:center}
.mrow th.lh{text-align:left;padding-left:14px;font-size:.7rem;color:var(--text)}
.drow th{background:var(--surface2);border-bottom:1px solid var(--border);font-size:.6rem;font-family:var(--fm);color:var(--text3);font-weight:400;padding:3px 0;text-align:center}
.drow th.lh{text-align:left;padding-left:14px;color:var(--text2);font-size:.68rem}
.grow td{border-bottom:1px solid rgba(227,225,216,.7)}
.grow:last-child td{border-bottom:none}.grow:hover td{background:rgba(248,247,244,.5)}
.glabel{padding:7px 10px;width:190px;min-width:190px;border-right:1px solid var(--border);vertical-align:middle;cursor:default}
.glabel .gn{font-weight:600;font-size:.79rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;color:var(--text)}
.glabel .gm{font-size:.66rem;color:var(--text2);font-family:var(--fm);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.glabel-inner{display:flex;align-items:center;gap:5px}
.impact-btn{width:20px;height:20px;border-radius:50%;border:none;background:var(--yellow-l);color:var(--yellow);font-size:.7rem;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:all .15s;box-shadow:0 0 0 2px rgba(146,64,14,.2)}
.impact-btn:hover{background:var(--yellow-m);transform:scale(1.1)}
.gbar-td{padding:0;vertical-align:middle;cursor:crosshair;user-select:none}
.g-bar-seg{cursor:pointer;transition:filter .1s}
.g-bar-seg:hover{filter:brightness(1.1)}
/* LEGEND */
.g-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.7rem;color:var(--text3)}
.g-legend-i{display:inline-flex;align-items:center;gap:4px}
.g-legend-d{width:10px;height:10px;border-radius:2px;flex-shrink:0}
/* ─ TEAM COLORS ─────────────────────────────────────────── */
:root{
  --tc0:#2355d4;--tc0-l:#eef2ff;--tc0-b:rgba(35,85,212,.18);
  --tc1:#047857;--tc1-l:#ecfdf5;--tc1-b:rgba(4,120,87,.18);
  --tc2:#7c3aed;--tc2-l:#f5f3ff;--tc2-b:rgba(124,58,237,.18);
  --tc3:#b45309;--tc3-l:#fffbeb;--tc3-b:rgba(180,83,9,.18);
  --tc4:#0e7490;--tc4-l:#ecfeff;--tc4-b:rgba(14,116,144,.18);
  --tc5:#be185d;--tc5-l:#fdf2f8;--tc5-b:rgba(190,24,93,.18);
  --tc6:#374151;--tc6-l:#f3f4f6;--tc6-b:rgba(55,65,81,.18);
  --tc7:#9a3412;--tc7-l:#fff7ed;--tc7-b:rgba(154,52,18,.18);
}
.gantt-empty-day{transition:background .1s}
.gantt-empty-day:hover{background:rgba(35,85,212,.08)}
/* ─ GANTT TEAM GROUP ROW ─────────────────────────────────── */
.gantt-team-hdr td{padding:4px 10px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border)}
.gantt-team-hdr .glabel{padding:4px 10px}
/* ─ SUPPORT TEAM MULTI SELECT ───────────────────────────── */
.support-team-list{display:flex;flex-direction:column;gap:4px;max-height:130px;overflow-y:auto;margin-top:5px;padding:2px}
.support-team-opt{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;transition:all .13s;font-size:.81rem}
.support-team-opt:hover{border-color:var(--border2);background:var(--surface)}
.support-team-opt.selected{border-color:var(--accent);background:var(--accent-l);color:var(--accent);font-weight:600}
.support-team-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.6rem;font-weight:700;color:#fff;transition:all .13s}
.support-team-opt.selected .support-team-check{background:var(--accent);border-color:var(--accent)}
.support-teams-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;font-size:.63rem;font-family:var(--fm);font-weight:600;background:var(--purple-l);color:var(--purple);margin-right:3px}
/* ─ TASK MODAL IMPROVED ──────────────────────────────────── */
.task-modal-preview{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.tmp-row{display:flex;align-items:center;justify-content:space-between;font-size:.8rem}
.tmp-label{color:var(--text3);font-size:.72rem;font-family:var(--fm)}
.tmp-value{font-weight:600;color:var(--text);font-family:var(--fm)}
.tmp-end-ok{color:var(--green)}.tmp-end-warn{color:var(--red)}
/* ─ TEAM PANEL ──────────────────────────────────────────── */

<script type="text/babel">
const { useState, useMemo, useRef, useEffect, useCallback } = React;

/* ══ UTILS ══════════════════════════════════════════════ */

const STATUSES=['todo','inprogress','review','done'];

/* ══ SUPABASE ═══════════════════════════════════════════ */
const SB_URL='https://hailzmuaqyejjmrbxfik.supabase.co';
const SB_KEY='sb_publishable_J-mn4WbxafSG4yoHdQu2kA_SvwOQy2o';

async function sbSaveProj(proj){

    await sb.from('projects').upsert({
      id:proj.id,

}

// Load all projects from Supabase (owner view — loads by ID list stored in localStorage)
async function sbLoadAll(ids){
  try{
    let q=sb.from('projects').select('data').order('updated_at',{ascending:true});
    if(ids&&ids.length>0)q=q.in('id',ids);
    else return []; // no owned projects
    const{data,error}=await q;
    if(error||!data)return null;

// Load a single project by shareKey (for guests opening a share link)
async function sbLoadByShareKey(shareKey){

    // Try share_key column first
    const{data,error}=await sb.from('projects').select('data').eq('share_key',shareKey).maybeSingle();
    if(!error&&data)return data.data;
    // Fallback: try matching by project id (for older projects without shareKey)
    const{data:data2,error:error2}=await sb.from('projects').select('data').eq('id',shareKey).maybeSingle();
    if(!error2&&data2)return data2.data;

const defProj=(name='Proje 1')=>({id:uid(),name,shareKey:uid()+uid(),projectTeams:[],tasks:[],baselineEnd:null,baselineTasks:null,completedAt:null,teams:[],items:[]});
const defState=()=>({userName:'',projects:[],activeProjId:null,activeTab:'dashboard'});

const decProj=s=>{try{return JSON.parse(decodeURIComponent(escape(atob(s))));}catch{return null;}};

/* ══ SCHEDULE ═══════════════════════════════════════════ */
function computeSched(tasks){return tasks.map(t=>{const dur=Math.max(1,parseInt(t.durationDays)||1);return{...t,start:t.startDate,end:addDays(t.startDate,dur-1),durationDays:dur};});}
const pEnd=s=>s.length?s.reduce((m,t)=>t.end>m?t.end:m,s[0].end):null;
const pStart=s=>s.length?s.reduce((m,t)=>t.start<m?t.start:m,s[0].start):null;

/* Task status helpers */
function getTS(task,baselineEnd,baselineTasks){
  if(!baselineEnd)return{delayed:false,extended:false,isNew:false};
  const orig=(baselineTasks||[]).find(o=>o.id===task.id);
  const isNew=!orig;
  const delayed=task.end>baselineEnd;
  // extended = ONLY when the actual duration in days increased vs baseline snapshot
  // A postponed task has same durationDays → extended=false ✓
  const extended=!!orig&&task.durationDays>orig.durationDays;
  return{delayed,extended,isNew};
}

/* ══ BAR SEGMENTS ═══════════════════════════════════════ */
const BAR={green:'linear-gradient(90deg,#047857,#059669)',blue:'linear-gradient(90deg,#1d4ed8,#6d28d9)',orange:'linear-gradient(90deg,#c2410c,#ea580c)',red:'linear-gradient(90deg,#991b1b,#b91c1c)',gray:'linear-gradient(90deg,#9ca3af,#6b7280)'};

function buildSegs(task,ps,today,orig,isNew,baselineEnd,DAY,completedAt){
  const off=d=>diffDays(ps,d);
  const tS=off(task.start),tE=off(task.end),todOff=off(today);

  // Grey: segments strictly AFTER completedAt → gray
  // On completedAt day: orange/red stay as-is (they mean delay/extension),
  //                     green/blue → green (task completed that day on time)
  const applyGrey=(segs)=>{
    if(!completedAt)return segs;
    const cutOff=off(completedAt);
    return segs.map(seg=>{
      const segDay=Math.round(seg.left/DAY);
      if(segDay>cutOff)return{...seg,color:'gray'};  // after completedAt → gray
      if(segDay===cutOff){
        // On completedAt day: keep red/orange (problem indicators), turn others green
        if(seg.color==='red'||seg.color==='orange')return seg;
        return{...seg,color:'green'};
      }
      return seg;
    });
  };

  if(!baselineEnd&&!orig){
    return applyGrey([{color:'blue',left:tS*DAY,width:(tE-tS+1)*DAY}]);
  }

  const blOff=baselineEnd?off(baselineEnd):null;

  // planEnd: same original duration applied from current start.
  // A postponed task (same duration, shifted start) → planEnd shifts too → no orange.
  // An extended task (longer duration) → planEnd > shifted end → orange appears.
  let planEnd;
  if(orig){
    const origDuration=diffDays(orig.start,orig.end);
    planEnd=addDays(task.start,origDuration);
  } else if(isNew){
    planEnd=baselineEnd;
  } else {
    planEnd=null;
  }
  if(!planEnd)return applyGrey([{color:'blue',left:tS*DAY,width:(tE-tS+1)*DAY}]);

  const planOff=off(planEnd);
  const segs=[];

  // The "safe zone" ends at min(planEnd, baselineEnd)
  // GREEN goes up to yesterday within safe zone
  const safeEnd=blOff!==null?Math.min(planOff,blOff):planOff;
  const gTo=Math.min(todOff-1,safeEnd,tE);
  if(gTo>=tS)segs.push({color:'green',left:tS*DAY,width:(gTo-tS+1)*DAY});

  // BLUE: future within safe zone
  const bFrom=Math.max(tS,todOff),bTo=Math.min(safeEnd,tE);
  if(bTo>=bFrom)segs.push({color:'blue',left:bFrom*DAY,width:(bTo-bFrom+1)*DAY});

  // ORANGE: task duration exceeded (task.end > planEnd) but within baselineEnd
  // Only shows when actual duration increased, not when task was merely postponed
  if(blOff!==null&&planOff<blOff&&tE>planOff){
    const orFrom=planOff+1,orTo=Math.min(blOff,tE);
    if(orTo>=orFrom)segs.push({color:'orange',left:orFrom*DAY,width:(orTo-orFrom+1)*DAY});
  }

  // RED: task.end > baselineEnd — always show regardless of why (postpone OR extend)
  if(blOff!==null&&tE>blOff){
    segs.push({color:'red',left:(blOff+1)*DAY,width:(tE-blOff)*DAY});
  }

  // Edge: no baseline → planEnd exceeded is orange up to infinity
  if(blOff===null&&tE>planOff){
    segs.push({color:'orange',left:(planOff+1)*DAY,width:(tE-planOff)*DAY});
  }

  return applyGrey(segs);
}

/* ══ IMPACT ANALYSIS ════════════════════════════════════
   For a task that is extended or delayed, find all tasks whose
   startDate > task's original end date (from baseline or original).
   User can select which to postpone.
══════════════════════════════════════════════════════════ */
function findImpactedTasks(changedTask,allScheduled,baselineTasks,origEndOverride){
  const orig=(baselineTasks||[]).find(o=>o.id===changedTask.id);
  const origEnd=origEndOverride||orig?.end;
  if(!origEnd)return [];
  return allScheduled.filter(t=>t.id!==changedTask.id&&t.start>origEnd);
}

/* ══ IMPACT MODAL ═══════════════════════════════════════
   Postpone logic:
   - changedTask has origEnd (from baseline) and newEnd (current task.end)
   - shift = diffDays(origEnd, newEnd)  — how many days the task overran
   - For each selected impacted task: newStart = addDays(task.start, shift)
   - So if origEnd=Apr30, newEnd=May5 => shift=5
     Task starting May3 => new start May3+5 = May8  ✓
══════════════════════════════════════════════════════════ */
function ImpactModal({changedTask,origEnd,impacted,projectTeams,onPostpone,onIgnore,onClose}){
  const[selected,setSelected]=useState([]);
  const toggle=id=>setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const shift=origEnd?diffDays(origEnd,changedTask.end):0;

  return(<div className="mbd">
    <div className="modal modal-flex" style={{maxWidth:500,padding:0}}>

      {/* HEADER - fixed */}
      <div style={{padding:'20px 20px 14px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
          <span style={{fontSize:'1.1rem'}}>⚡</span>
          <span style={{fontFamily:'var(--fd)',fontWeight:700,fontSize:'1rem',flex:1}}>Bağımlı Görev Analizi</span>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:'1.2rem',cursor:'pointer',color:'var(--text3)',lineHeight:1}}>×</button>
        </div>
        <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 12px'}}>
          <div style={{fontWeight:700,fontSize:'.85rem',marginBottom:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {changedTask.name}
            {changedTask.teamName&&<span style={{marginLeft:6,fontSize:'.72rem',fontWeight:400,color:'var(--text3)'}}>[{changedTask.teamName}]</span>}
          </div>
          {shift>0&&origEnd
            ?<div style={{fontSize:'.78rem',color:'var(--text2)'}}>Orijinal bitiş <strong>{fmt(origEnd)}</strong> → yeni bitiş <strong style={{color:'var(--red)'}}>{fmt(changedTask.end)}</strong> <span style={{color:'var(--red)',fontWeight:700}}>(+{shift}g)</span></div>
            :<div style={{fontSize:'.78rem',color:'var(--text2)'}}>Bitiş: <strong>{fmt(changedTask.end)}</strong> — sonrasında başlayan görevler etkilenebilir</div>
          }
        </div>
        <div style={{marginTop:10,fontSize:'.72rem',fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.05em'}}>
          Etkilenebilecek Görevler ({impacted.length}){shift>0&&<span style={{fontWeight:400,marginLeft:4}}>— seçilenler +{shift}g ötelenir</span>}
        </div>
      </div>

      {/* LIST - scrollable */}
      <div style={{overflowY:'auto',flexGrow:1,flexShrink:1,flexBasis:0,minHeight:0,padding:'10px 20px'}}>
        {impacted.length===0
          ?<div style={{padding:'20px 0',textAlign:'center',color:'var(--text3)',fontSize:'.85rem'}}>Sonrasında başlayan başka görev yok.</div>
          :impacted.map(t=>{
            const isSel=selected.includes(t.id);
            const newStart=addDays(t.start,shift);
            const tIdx=(projectTeams||[]).findIndex(p=>p.name===t.teamName);
            const tColor=tIdx>=0?TEAM_COLORS[tIdx%TEAM_COLORS.length]:'var(--accent)';
            return(
              <div key={t.id} onClick={()=>toggle(t.id)} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'10px 12px',marginBottom:6,border:`1px solid ${isSel?'var(--accent)':'var(--border)'}`,borderLeft:`3px solid ${isSel?'var(--accent)':'var(--border)'}`,borderRadius:8,background:isSel?'var(--accent-l)':'var(--surface2)',cursor:'pointer',transition:'all .12s'}}>
                <div style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${isSel?'var(--accent)':'var(--border2)'}`,background:isSel?'var(--accent)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2,color:'#fff',fontSize:'.65rem',fontWeight:700}}>{isSel&&'✓'}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:2}}>
                    <span style={{fontWeight:600,fontSize:'.82rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{t.name}</span>
                    {t.teamName&&<span style={{fontSize:'.65rem',color:tColor,fontWeight:700,flexShrink:0}}>[{t.teamName.length>14?t.teamName.slice(0,14)+'…':t.teamName}]</span>}
                  </div>
                  <div style={{fontSize:'.75rem',color:'var(--text2)'}}>
                    Başlangıç: <strong>{fmt(t.start)}</strong>
                    {isSel&&shift>0&&<span style={{color:'var(--accent)',fontWeight:700,marginLeft:8}}>→ {fmt(newStart)} (+{shift}g)</span>}
                  </div>
                </div>
              </div>
            );
          })
        }
      </div>

      {/* FOOTER - fixed */}
      <div style={{borderTop:'1px solid var(--border)',padding:'12px 20px',flexShrink:0}}>
        {impacted.length>1&&<div style={{display:'flex',gap:6,marginBottom:10}}>
          <button className="btn btn-g btn-sm" onClick={()=>setSelected(impacted.map(t=>t.id))}>Tümünü Seç</button>
          <button className="btn btn-g btn-sm" onClick={()=>setSelected([])}>Temizle</button>
        </div>}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="btn btn-g" onClick={onIgnore}>Yoksay</button>
          <button className="btn btn-p" onClick={()=>onPostpone(selected)} disabled={selected.length===0}>
            {selected.length>0?`${selected.length} Görevi Ötele (+${shift}g)`:'Ötele'}
          </button>
        </div>
      </div>
    </div>
  </div>);
}

/* ══ TEAM COLOR HELPERS ══════════════════════════════════ */
const TEAM_COLORS=['#2355d4','#047857','#7c3aed','#b45309','#0e7490','#be185d','#374151','#9a3412'];
const TEAM_COLORS_L=['#eef2ff','#ecfdf5','#f5f3ff','#fffbeb','#ecfeff','#fdf2f8','#f3f4f6','#fff7ed'];
const TEAM_COLORS_BG=['rgba(35,85,212,.07)','rgba(4,120,87,.07)','rgba(124,58,237,.07)','rgba(180,83,9,.07)','rgba(14,116,144,.07)','rgba(190,24,93,.07)','rgba(55,65,81,.07)','rgba(154,52,18,.07)'];
function teamColorIdx(teamName,projectTeams){const idx=(projectTeams||[]).findIndex(t=>t.name===teamName);return idx>=0?idx%TEAM_COLORS.length:6;}

/* ══ GANTT CHART ════════════════════════════════════════ */
function GanttChart({scheduled,baselineTasks,baselineEnd,completedAt,teamFilter,ganttRef,onBarClick,impactMap,onImpactClick,projectTeams,onDragSelect,onTeamAddClick,sortByDate,onBarResize}){
  const cref=useRef(null);
  const[cw,setCw]=useState(700);
  const dragRef=useRef(null);
  const[dragVis,setDragVis]=useState(null);

  useEffect(()=>{
    if(!cref.current)return;
    const ro=new ResizeObserver(e=>setCw(e[0].contentRect.width));
    ro.observe(cref.current);
    return()=>ro.disconnect();
  },[]);

  // Global mouseup — resolves drag anywhere, even if mouse left the element
  useEffect(()=>{
    const onUp=e=>{
      const d=dragRef.current;
      if(!d)return;
      dragRef.current=null;
      setDragVis(null);
      const moved=Math.abs(e.clientX-d.startX)>4;
      if(moved&&d.onDragSelectFn){
        const s=Math.min(d.startDay,d.endDay),en=Math.max(d.startDay,d.endDay);
        d.onDragSelectFn({startDate:d.days[s],durationDays:en-s+1,teamName:d.teamName});
      }
    };
    const onMove=e=>{
      if(!dragRef.current)return;
      const rows=cref.current?.querySelectorAll('div[data-dragtarget]');
      if(!rows)return;
      rows.forEach(div=>{
        const rect=div.getBoundingClientRect();
        if(e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom){
          const DAY=dragRef.current.DAY;
          const dayIdx=Math.max(0,Math.min(dragRef.current.days.length-1,Math.floor((e.clientX-rect.left)/DAY)));
          dragRef.current={...dragRef.current,endDay:dayIdx};
          setDragVis({...dragRef.current});
        }
      });
    };
    document.addEventListener('mouseup',onUp);
    document.addEventListener('mousemove',onMove);
    return()=>{document.removeEventListener('mouseup',onUp);document.removeEventListener('mousemove',onMove);};
  },[]);

  const today=todayStr();
  // Filter: ana ekip VEYA destek ekip olarak dahil olanlar
  const filtered=teamFilter==='all'
    ?scheduled
    :scheduled.filter(t=>(t.teamName||'')===teamFilter||(t.supportTeams||[]).includes(teamFilter));
  if(!filtered.length)return<div ref={el=>{cref.current=el;if(ganttRef)ganttRef.current=el;}} style={{padding:40,textAlign:'center',color:'var(--text3)'}}><div style={{fontSize:'1.8rem',marginBottom:8}}>📅</div><div style={{fontFamily:'var(--fd)',fontWeight:600,color:'var(--text2)'}}>Görev yok</div></div>;
  const ps=pStart(filtered),pe=pEnd(filtered);
  const bPe=baselineTasks?pEnd(baselineTasks.filter(t=>filtered.some(f=>f.id===t.id))):null;
  const totalDays=Math.max(14,diffDays(ps,bPe&&bPe>pe?bPe:pe)+5);
  const labelW=190,avail=cw-labelW-20;
  const DAY=Math.max(12,Math.min(36,Math.floor(avail/totalDays)));
  const totalW=totalDays*DAY;
  const days=Array.from({length:totalDays},(_,i)=>addDays(ps,i));
  const months=[];
  days.forEach(d=>{const dt=new Date(d),key=`${dt.getFullYear()}-${dt.getMonth()}`;if(!months.length||months[months.length-1].key!==key)months.push({key,label:dt.toLocaleString('tr-TR',{month:'long',year:'numeric'}),count:0});months[months.length-1].count++;});
  const todOff=diffDays(ps,today);
  const showToday=!completedAt&&todOff>=0&&todOff<totalDays;

  // Group tasks: by team (sorted by date within group) or flat by date
  const grouped=[];
  if(sortByDate){
    grouped.push({teamName:null,tasks:[...filtered].sort((a,b)=>a.start.localeCompare(b.start)),flat:true});
  } else {
    const teamOrder=(projectTeams||[]).map(t=>t.name);
    const seen=new Set();
    teamOrder.forEach(tname=>{
      const tTasks=filtered.filter(t=>t.teamName===tname).sort((a,b)=>a.start.localeCompare(b.start));
      if(tTasks.length>0){grouped.push({teamName:tname,tasks:tTasks});seen.add(tname);}
    });
    const rest=filtered.filter(t=>!seen.has(t.teamName)).sort((a,b)=>a.start.localeCompare(b.start));
    if(rest.length>0)grouped.push({teamName:rest[0].teamName||'',tasks:rest});
  }
  const showGroupHeaders=!sortByDate;

  return(<div ref={el=>{cref.current=el;if(ganttRef)ganttRef.current=el;}} style={{overflowX:'auto'}}
    onMouseMove={e=>{}}
    onMouseLeave={()=>{}}
  >
    <table className="gtable" style={{width:labelW+totalW}}>
      <colgroup><col style={{width:labelW}}/><col style={{width:totalW}}/></colgroup>
      <thead>
        <tr className="mrow"><th className="lh">Görev</th><th style={{padding:0}}><div style={{display:'flex',width:totalW}}>{months.map(m=><div key={m.key} style={{width:m.count*DAY,borderLeft:'1px solid var(--border)',textAlign:'center',padding:'4px 2px',fontSize:'.65rem',fontFamily:'var(--fm)',color:'var(--text2)',fontWeight:700,flexShrink:0,overflow:'hidden',whiteSpace:'nowrap'}}>{m.label}</div>)}</div></th></tr>
        <tr className="drow"><th className="lh">Tarih/Süre</th><th style={{padding:0}}><div style={{display:'flex',width:totalW}}>{days.map(d=>{const isT=!completedAt&&d===today;return<div key={d} style={{width:DAY,flexShrink:0,textAlign:'center',fontSize:'.58rem',fontFamily:'var(--fm)',padding:'3px 0',borderLeft:'1px solid var(--border)',color:isT?'var(--accent)':'var(--text3)',fontWeight:isT?700:400,background:isT?'var(--accent-l)':'transparent'}}>{new Date(d).getDate()}</div>;})}
        </div></th></tr>
      </thead>
      <tbody>
        {grouped.map(({teamName,tasks:gTasks})=>{
          const tIdx=teamColorIdx(teamName,projectTeams);
          const tColor=TEAM_COLORS[tIdx];
          const tBg=TEAM_COLORS_BG[tIdx];
          const tLt=TEAM_COLORS_L[tIdx];
          return(<React.Fragment key={teamName||'__no_team'}>
            {showGroupHeaders&&<tr className="gantt-team-hdr">
              <td className="glabel" style={{background:tLt,borderLeft:`3px solid ${tColor}`,padding:'5px 10px'}}>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <div style={{width:8,height:8,borderRadius:'50%',background:tColor,flexShrink:0}}/>
                  <span style={{fontWeight:700,fontSize:'.72rem',color:tColor,textTransform:'uppercase',letterSpacing:'.06em',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{teamName||'Ekipsiz'}</span>
                  <span style={{fontSize:'.66rem',color:tColor,opacity:.7,fontFamily:'var(--fm)',flexShrink:0}}>{gTasks.length} görev</span>
                  {onTeamAddClick&&!completedAt&&<button onClick={e=>{e.stopPropagation();onTeamAddClick(teamName);}} style={{marginLeft:4,width:18,height:18,borderRadius:4,border:`1px solid ${tColor}`,background:'transparent',color:tColor,fontSize:'.75rem',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,lineHeight:1}} title={`${teamName} ekibine görev ekle`}>+</button>}
                </div>
              </td>
              <td style={{background:tLt,borderLeft:'none'}}>
                <div style={{width:totalW,height:'100%',background:`repeating-linear-gradient(90deg,${tBg} 0,${tBg} 1px,transparent 1px,transparent ${DAY}px)`}}/>
              </td>
            </tr>}
            {gTasks.map(task=>{
              const orig=(baselineTasks||[]).find(o=>o.id===task.id);
              const isNew=!!baselineEnd&&!orig;
              const segs=buildSegs(task,ps,today,orig||null,isNew,baselineEnd,DAY,completedAt);
              const hasRed=segs.some(s=>s.color==='red');
              const hasOrange=segs.some(s=>s.color==='orange');
              const tip=`${task.name}${task.teamName?' ['+task.teamName+']':''}\n${fmt(task.start)} – ${fmt(task.end)} (${task.durationDays}g)${(task.supportTeams||[]).length>0?'\nDestek: '+(task.supportTeams||[]).join(', '):''}${hasRed?' ⚠ Gecikme':hasOrange?' ~ Uzama':''}`;
              const hasImpact=!!(impactMap&&impactMap[task.id]&&impactMap[task.id].length>0);
              // Row background tint for team grouping
              const rowBg=showGroupHeaders?`${tBg}`:undefined;
              return(<tr key={task.id} className="grow">
                <td className="glabel" title={tip} style={rowBg?{background:rowBg,borderLeft:`3px solid ${tColor}`}:{borderLeft:'3px solid transparent'}}>
                  <div className="glabel-inner">
                    <div style={{flex:1,minWidth:0}}>
                      <div className="gn">{task.name}</div>
                      <div className="gm">
                        {task.teamName&&<span style={{color:tColor,marginRight:3,fontWeight:600}}>[{task.teamName.length>12?task.teamName.slice(0,12)+'…':task.teamName}]</span>}
                        {task.durationDays}g
                        {hasRed&&<span style={{marginLeft:4,color:'var(--red)',fontWeight:700}}>⚠</span>}
                        {!hasRed&&hasOrange&&<span style={{marginLeft:4,color:'var(--orange)',fontWeight:700}}>~</span>}
                      </div>
                      {(task.supportTeams||[]).length>0&&<div style={{fontSize:'.6rem',color:'var(--purple)',fontFamily:'var(--fm)',marginTop:1,lineHeight:1.3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:160}}>
                        🤝 {(task.supportTeams||[]).join(', ')}
                      </div>}
                    </div>
                    {hasImpact&&<button className="impact-btn" onClick={e=>{e.stopPropagation();onImpactClick&&onImpactClick(task);}} title="Bu görev uzadı/gecikmedi — etkilenebilecek görevler var">⚡</button>}
                  </div>
                </td>
                <td className="gbar-td" style={rowBg?{background:rowBg}:{}}>
                  <div data-dragtarget="1" style={{position:'relative',width:totalW,height:32}}
                    onMouseDown={e=>{
                      if(completedAt||e.target.closest('.g-bar-seg'))return;
                      if(!onDragSelect)return;
                      const rect=e.currentTarget.getBoundingClientRect();
                      const dayIdx=Math.max(0,Math.floor((e.clientX-rect.left)/DAY));
                      dragRef.current={startDay:dayIdx,endDay:dayIdx,taskId:task.id,teamName:task.teamName,startX:e.clientX,DAY,days,onDragSelectFn:onDragSelect};
                      setDragVis({...dragRef.current});
                    }}
                  >
                    {days.map((d,i)=><div key={d} style={{position:'absolute',left:i*DAY,top:0,bottom:0,width:1,background:'rgba(227,225,216,.9)',pointerEvents:'none'}}/>)}
                    {showToday&&<div style={{position:'absolute',left:todOff*DAY+DAY/2-1,top:0,bottom:0,width:2,background:'var(--accent)',zIndex:5,boxShadow:'0 0 5px rgba(35,85,212,.4)',borderRadius:2,pointerEvents:'none'}}/>}
                    {dragVis&&dragVis.taskId===task.id&&!dragVis.onBar&&<div style={{position:'absolute',left:Math.min(dragVis.startDay,dragVis.endDay)*DAY,width:(Math.abs(dragVis.endDay-dragVis.startDay)+1)*DAY,top:2,height:28,background:'rgba(35,85,212,.18)',border:'2px solid var(--accent)',borderRadius:4,zIndex:6,pointerEvents:'none'}}/>}
                    {segs.map((seg,si)=>{
                      const isLast=si===segs.length-1;
                      return(<div key={si} className="g-bar-seg" title={tip}
                        onMouseDown={e=>e.stopPropagation()}
                        onClick={()=>!completedAt&&onBarClick&&onBarClick(task)}
                        style={{position:'absolute',left:seg.left,width:Math.max(DAY,seg.width),top:5,height:22,background:BAR[seg.color],borderRadius:si===0&&isLast?5:si===0?'5px 0 0 5px':isLast?'0 5px 5px 0':0,boxShadow:'0 1px 5px rgba(0,0,0,.1)',zIndex:2,pointerEvents:'auto',cursor:'pointer'}}>
                        {isLast&&onBarResize&&!completedAt&&<div
                          style={{position:'absolute',right:0,top:0,bottom:0,width:8,cursor:'ew-resize',background:'rgba(255,255,255,.3)',borderRadius:'0 5px 5px 0',zIndex:3,pointerEvents:'all'}}
                          onMouseDown={e=>{
                            e.stopPropagation();
                            const startX=e.clientX;
                            const origDays=task.durationDays;
                            const onMove=ev=>{
                              const dx=ev.clientX-startX;
                              const newDays=Math.max(1,origDays+Math.round(dx/DAY));
                              onBarResize(task,newDays);
                            };
                            const onUp=ev=>{
                              const dx=ev.clientX-startX;
                              const newDays=Math.max(1,origDays+Math.round(dx/DAY));
                              if(newDays!==origDays)onBarResize(task,newDays,true);
                              document.removeEventListener('mousemove',onMove);
                              document.removeEventListener('mouseup',onUp);
                            };
                            document.addEventListener('mousemove',onMove);
                            document.addEventListener('mouseup',onUp);
                          }}
                          title="Sürükleyerek süreyi değiştir"
                        />}
                      </div>);
                    })}
                  </div>
                </td>
              </tr>);
            })}
          </React.Fragment>);
        })}
      </tbody>
    </table>
  </div>);
}

/* ══ CONFIRM MODAL ══════════════════════════════════════ */
function ConfirmModal({title,message,onConfirm,onCancel}){
  return(<div className="mbd"><div className="modal modal-sm"><div className="modal-title">{title}</div><p style={{fontSize:'.85rem',color:'var(--text2)',lineHeight:1.55}}>{message}</p><div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:20}}><button className="btn btn-g" onClick={onCancel}>Vazgeç</button><button className="btn btn-rd" onClick={onConfirm}>Evet, Sil</button></div></div></div>);
}

function CompleteProjectModal({proj,onSave,onClose}){
  const sc=useMemo(()=>computeSched(proj.tasks),[proj.tasks]);
  const pe=pEnd(sc);
  const baselineEnd=proj.baselineEnd;
  // Reference = baseline if set, otherwise planned end
  const reference=baselineEnd||pe;
  const[date,setDate]=useState(todayStr());
  const isEarly=reference&&date<reference;
  const isLate=reference&&date>reference;
  return(<div className="mbd"><div className="modal modal-sm">
    <div className="modal-title">🏁 Projeyi Sonlandır</div>
    <div className="fr"><div><label className="lbl">Gerçek Bitiş Tarihi</label><input className="inp" type="date" value={date} onChange={e=>setDate(e.target.value)}/></div></div>
    {reference&&<div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:'9px 12px',marginBottom:10,fontSize:'.8rem',fontFamily:'var(--fm)',display:'flex',flexDirection:'column',gap:5}}>
      <div>{baselineEnd?'Baseline bitiş':'Planlanan bitiş'}: <strong>{fmt(reference)}</strong></div>
      {isEarly&&<div style={{color:'var(--green)',fontWeight:600}}>✅ {diffDays(date,reference)} gün erken</div>}
      {isLate&&<div style={{color:'var(--red)',fontWeight:600}}>⚠ {diffDays(reference,date)} gün gecikmeli</div>}
      {!isEarly&&!isLate&&<div style={{color:'var(--text2)'}}>Tam zamanında</div>}
    </div>}
    <div className="form-foot"><button className="btn btn-g" onClick={onClose}>İptal</button><button className="btn btn-p" onClick={()=>onSave(date)}>Sonlandır</button></div>
  </div></div>);
}

/* ══ TASKS FULL MODAL (view + optional edit) ════════════ */
function TasksFullModal({scheduled,baselineTasks,baselineEnd,readOnly,onEdit,onDelete,onDuplicate,onClose}){
  return(<div className="mbd">
    <div className="modal modal-lg">
      <div style={{display:'flex',alignItems:'center',marginBottom:18,gap:10}}>
        <span className="modal-title" style={{marginBottom:0,flex:1}}>
          Tüm Görevler ({scheduled.length})
          {readOnly&&<span className="badge b-tl" style={{marginLeft:8}}>🔒 Salt Okunur</span>}
        </span>
        <button className="btn btn-g btn-sm" onClick={onClose}>Kapat</button>
      </div>
      {scheduled.length===0?<div className="no-hint">Görev yok</div>:
        <div style={{display:'flex',flexDirection:'column',gap:7,maxHeight:'60vh',overflowY:'auto',paddingRight:4}}>
          {scheduled.map((t,i)=>{
            const orig=(baselineTasks||[]).find(o=>o.id===t.id);
            const delayed=baselineEnd&&t.end>baselineEnd;
            const extended=orig&&t.durationDays>orig.durationDays;
            const isNew=baselineEnd&&!orig;
            let cls='';
            if(delayed)cls=' delayed';else if(extended)cls=' extended';else if(isNew)cls=' new-after-bl';
            return(<div key={t.id} className={`titem${cls}`} style={{flexDirection:'row',alignItems:'flex-start',gap:10,display:'flex'}}>
              <span style={{fontFamily:'var(--fm)',fontSize:'.72rem',color:'var(--text3)',width:22,flexShrink:0,paddingTop:2,textAlign:'right'}}>{i+1}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:'.88rem',wordBreak:'break-word'}}>{t.name}</div>
                <div style={{fontSize:'.75rem',color:'var(--text2)',fontFamily:'var(--fm)',marginTop:3}}>
                  {t.teamName&&<span style={{color:'var(--accent)',marginRight:6}}>[{t.teamName}]</span>}
                  {(t.supportTeams||[]).length>0&&<span style={{color:'var(--purple)',marginRight:6,fontSize:'.7rem'}}>🤝 {(t.supportTeams||[]).join(', ')}</span>}
                  {t.durationDays}g · {fmt(t.start)} → {fmt(t.end)}
                </div>
                <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:4}}>
                  {delayed&&<span className="badge b-rd">⚠ Gecikme{extended?' & Uzama':''}</span>}
                  {!delayed&&extended&&<span className="badge b-or">~ Uzama</span>}
                  {isNew&&!delayed&&<span className="badge b-bl">+ Baseline sonrası</span>}
                </div>
              </div>
              {!readOnly&&<div style={{display:'flex',gap:4,flexShrink:0}}>
                <button className="ibtn b" onClick={()=>onDuplicate&&onDuplicate(t)} title="Kopyala">⧉</button>
                <button className="ibtn b" onClick={()=>{onEdit(t);}} title="Düzenle">✏️</button>
                <button className="ibtn r" onClick={()=>onDelete(t.id)} title="Sil">🗑</button>
              </div>}
            </div>);
          })}
        </div>
      }
    </div>
  </div>);
}

/* ══ TASK MODAL ═════════════════════════════════════════ */
function TaskModal({initial,isDuplicate,prefill,tasks,projectTeams,onSave,onClose,projStartDate,baselineEnd}){
  const[f,setF]=useState(initial?{
    name:initial.name,
    teamName:initial.teamName||'',
    supportTeams:initial.supportTeams||[],
    startDate:initial.startDate,
    durationMode:initial.durationMode||'days',
    durationInput:initial.durationInput||initial.durationDays||1,
    sprintWeeks:initial.sprintWeeks||2
  }:{name:'',teamName:prefill?.teamName||'',supportTeams:[],startDate:prefill?.startDate||todayStr(),durationMode:'days',durationInput:prefill?.durationInput||prefill?.durationDays||1,sprintWeeks:2});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const[errors,setErrors]=useState({});
  const[showSupportPicker,setShowSupportPicker]=useState(!!(initial&&initial.supportTeams&&initial.supportTeams.length>0));
  const maxSp=maxSprints(f.sprintWeeks);
  const durationDays=toDays(f.durationInput,f.durationMode,f.sprintWeeks);
  const endDate=f.startDate&&durationDays>=1?addDays(f.startDate,durationDays-1):null;
  const isLateEnd=endDate&&baselineEnd&&endDate>baselineEnd;

  // Support teams: exclude selected primary team
  const supportOptions=projectTeams.filter(t=>t.name!==f.teamName);
  const toggleSupport=name=>{
    const cur=f.supportTeams||[];
    set('supportTeams',cur.includes(name)?cur.filter(n=>n!==name):[...cur,name]);
  };
  // Clear support teams that conflict with newly chosen primary team
  const setPrimaryTeam=name=>{
    set('teamName',name);
    set('supportTeams',(f.supportTeams||[]).filter(n=>n!==name));
    setErrors(p=>({...p,teamName:null}));
  };

  const submit=()=>{
    const errs={};
    if(!f.name.trim())errs.name='Görev adı zorunlu';
    if(!f.teamName)errs.teamName='Ekip seçimi zorunlu';
    if(!f.startDate)errs.startDate='Tarih zorunlu';
    if(projStartDate&&f.startDate<projStartDate)errs.startDate=`Proje başlangıcından (${fmt(projStartDate)}) önce olamaz`;
    if(Object.keys(errs).length){setErrors(errs);return;}
    onSave({...f,durationDays,supportTeams:f.supportTeams||[],durationInput:f.durationMode==='sprints'?clampSprints(f.durationInput,f.sprintWeeks):clampDays(f.durationInput)});
  };
  const handleDurChange=v=>set('durationInput',v===''?'':parseInt(v)||'');
  const handleDurBlur=()=>{if(f.durationMode==='sprints')set('durationInput',clampSprints(f.durationInput||1,f.sprintWeeks));else set('durationInput',clampDays(f.durationInput||1));};

  return(<div className="mbd"><div className="modal">
    <div className="modal-title" style={{display:'flex',alignItems:'center',gap:8}}>
      <span style={{fontSize:'1rem',opacity:.6}}>{isDuplicate?'⧉':initial?'✏️':'➕'}</span>
      {isDuplicate?'Görevi Kopyala':initial?'Görevi Düzenle':'Yeni Görev Ekle'}
    </div>

    {/* Görev Adı */}
    <div className="fr"><div>
      <label className="lbl">Görev Adı *</label>
      <input className="inp" placeholder="Örn: UI Tasarımı" value={f.name}
        onChange={e=>{set('name',e.target.value);setErrors(p=>({...p,name:null}));}} autoFocus/>
      {errors.name&&<div style={{fontSize:'.72rem',color:'var(--red)',marginTop:3}}>{errors.name}</div>}
    </div></div>

    {/* Ana Ekip */}
    <div className="fr"><div>
      <label className="lbl">Ana Ekip *</label>
      <select className="sel" value={f.teamName} onChange={e=>setPrimaryTeam(e.target.value)}>
        <option value="">— Ekip Seç —</option>
        {projectTeams.map(t=><option key={t.id} value={t.name} title={t.name}>{t.name.length>36?t.name.slice(0,36)+'…':t.name}</option>)}
      </select>
      {errors.teamName&&<div style={{fontSize:'.72rem',color:'var(--red)',marginTop:3}}>{errors.teamName}</div>}
    </div></div>

    {/* Destek Ekipler */}
    {projectTeams.length>1&&<div className="fr"><div>
      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
        <label className="lbl" style={{margin:0,flex:1}}>Destek Ekipler <span style={{color:'var(--text3)',fontWeight:400}}>(opsiyonel)</span></label>
        <button type="button" style={{fontSize:'.72rem',color:'var(--accent)',background:'none',border:'none',cursor:'pointer',padding:'2px 4px',fontWeight:600}} onClick={()=>setShowSupportPicker(v=>!v)}>
          {showSupportPicker?'▲ Gizle':'▼ Ekip Seç'}
        </button>
      </div>
      {/* Selected support team badges */}
      {(f.supportTeams||[]).length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:5}}>
        {(f.supportTeams||[]).map(n=><span key={n} className="support-teams-badge" onClick={()=>toggleSupport(n)} style={{cursor:'pointer'}} title="Kaldır">🤝 {n} ×</span>)}
      </div>}
      {showSupportPicker&&supportOptions.length>0&&<div className="support-team-list">
        {supportOptions.map(t=>{
          const sel=(f.supportTeams||[]).includes(t.name);
          return(<div key={t.id} className={`support-team-opt${sel?' selected':''}`} onClick={()=>toggleSupport(t.name)}>
            <div className="support-team-check">{sel&&'✓'}</div>
            <span>{t.name}</span>
          </div>);
        })}
      </div>}
      {showSupportPicker&&supportOptions.length===0&&f.teamName&&<div style={{fontSize:'.74rem',color:'var(--text3)',padding:'6px 4px'}}>Seçilebilecek başka ekip yok.</div>}
    </div></div>}

    {/* Tarih */}
    <div className="fr"><div>
      <label className="lbl">Başlangıç Tarihi *{projStartDate&&<span style={{color:'var(--text3)',fontWeight:400}}> — min: {fmt(projStartDate)}</span>}</label>
      <input className="inp" type="date" value={f.startDate} min={projStartDate||''}
        onChange={e=>{set('startDate',e.target.value);setErrors(p=>({...p,startDate:null}));}}/>
      {errors.startDate&&<div style={{fontSize:'.72rem',color:'var(--red)',marginTop:3}}>{errors.startDate}</div>}
    </div></div>

    {/* Süre */}
    <div className="fr"><div>
      <label className="lbl">Süre Türü</label>
      <div className="seg-ctrl">
        <button type="button" className={`seg-btn${f.durationMode==='days'?' on':''}`} onClick={()=>{set('durationMode','days');set('durationInput',1);}}>📅 Gün</button>
        <button type="button" className={`seg-btn${f.durationMode==='sprints'?' on':''}`} onClick={()=>{set('durationMode','sprints');set('durationInput',1);}}>🔄 Sprint</button>
      </div>
    </div></div>
    <div className={`fr${f.durationMode==='sprints'?' fr2':''}`}>
      <div>
        <label className="lbl">{f.durationMode==='sprints'?`Sprint Sayısı (1–${maxSp})`:`Süre (1–${MAX_DAYS} gün)`}</label>
        <input className="inp" type="number" min="1" max={f.durationMode==='sprints'?maxSp:MAX_DAYS}
          value={f.durationInput} onChange={e=>handleDurChange(e.target.value)} onBlur={handleDurBlur}/>
      </div>
      {f.durationMode==='sprints'&&<div>
        <label className="lbl">Sprint Uzunluğu</label>
        <select className="sel" value={f.sprintWeeks} onChange={e=>{const sw=parseInt(e.target.value);set('sprintWeeks',sw);set('durationInput',1);}}>
          <option value={1}>1 hafta</option><option value={2}>2 hafta</option>
          <option value={3}>3 hafta</option><option value={4}>4 hafta</option>
        </select>
      </div>}
    </div>

    {/* Önizleme kartı */}
    {endDate&&<div className="task-modal-preview">
      <div className="tmp-row">
        <span className="tmp-label">📅 Bitiş Tarihi</span>
        <span className={`tmp-value ${isLateEnd?'tmp-end-warn':''}`}>{fmt(endDate)}{isLateEnd&&' ⚠'}</span>
      </div>
      <div className="tmp-row">
        <span className="tmp-label">⏱ Toplam Süre</span>
        <span className="tmp-value">{durationDays} gün{f.durationMode==='sprints'&&` (${f.durationInput} sprint)`}</span>
      </div>
      {f.teamName&&<div className="tmp-row">
        <span className="tmp-label">👥 Ana Ekip</span>
        <span className="tmp-value" style={{color:'var(--accent)'}}>{f.teamName}</span>
      </div>}
      {(f.supportTeams||[]).length>0&&<div className="tmp-row">
        <span className="tmp-label">🤝 Destek</span>
        <span className="tmp-value" style={{color:'var(--purple)',fontSize:'.78rem'}}>{(f.supportTeams||[]).join(', ')}</span>
      </div>}
      {isLateEnd&&baselineEnd&&<div style={{fontSize:'.72rem',color:'var(--red)',marginTop:2,fontFamily:'var(--fm)'}}>⚠ Baseline bitiş: {fmt(baselineEnd)} — bu tarih aşılıyor</div>}
    </div>}

    <div className="form-foot">
      <button className="btn btn-g" onClick={onClose}>İptal</button>
      <button className="btn btn-p" onClick={submit}>{isDuplicate?'Kopyayı Kaydet':initial?'Güncelle':'Görevi Ekle'}</button>
    </div>
  </div></div>);
}

/* ══ TIMELINE TAB ═══════════════════════════════════════ */
function TimelineTab({proj,updateProj}){
  const{tasks,baselineEnd,baselineTasks,projectTeams=[],completedAt}=proj;
  const[activeModal,setActiveModal]=useState(null); // {mode:'new'|'edit'|'dup', prefill?, task?}
  const[showAll,setShowAll]=useState(false);
  const[tFilt,setTFilt]=useState('all');
  const[sumOpen,setSumOpen]=useState(true);
  const[teamsOpen,setTeamsOpen]=useState(true);
  const[tasksOpen,setTasksOpen]=useState(true);
  const[newTeamName,setNewTeamName]=useState('');
  const[newMember,setNewMember]=useState({});
  const[confirmDelTeam,setConfirmDelTeam]=useState(null);
  const[showComplete,setShowComplete]=useState(false);
  const[exporting,setExporting]=useState(false);
  const[ganttSortDate,setGanttSortDate]=useState(false);
  const ignoredImpacts=proj.ignoredImpacts||{};
  const setIgnoredImpact=(taskId,origEnd)=>updateProj(p=>({...p,ignoredImpacts:{...(p.ignoredImpacts||{}),[taskId]:origEnd}}));
  const clearIgnoredImpact=(taskId)=>updateProj(p=>{const ig={...(p.ignoredImpacts||{})};delete ig[taskId];return{...p,ignoredImpacts:ig};});
  const ganttRef=useRef(null);
  const teamsRef=useRef(null);

  const scheduled=useMemo(()=>computeSched(tasks),[tasks]);
  // Task list sorted by date
  const sortedScheduled=useMemo(()=>[...scheduled].sort((a,b)=>a.start.localeCompare(b.start)),[scheduled]);
  const pe=pEnd(scheduled),ps=pStart(scheduled);
  const delay=pe&&baselineEnd?Math.max(0,diffDays(baselineEnd,pe)):0;

  // Timeline progress: sadece zaman yüzdesi (projenin kaçta kaçı geçti)
  const timePct=useMemo(()=>{
    if(!ps||!pe||completedAt)return null;
    const today=todayStr();
    if(today<ps)return 0;
    if(today>pe)return 100;
    const total=Math.max(1,diffDays(ps,pe));
    return Math.round(diffDays(ps,today)/total*100);
  },[ps,pe,completedAt]);

  // canAdd: if no teams, scroll to teams panel and open it instead of blocking
  const canAdd=projectTeams.length>0&&!completedAt;
  const handleAddClick=()=>{
    if(!canAdd&&!completedAt){
      setTeamsOpen(true);
      setTimeout(()=>teamsRef.current?.scrollIntoView({behavior:'smooth',block:'start'}),50);
      return;
    }
    setActiveModal({mode:'new'});
  };

  // Build impact map: for each delayed/extended task, find impacted tasks
  // ignoredImpacts stores {taskId: "lastIgnoredTaskEnd"} - re-triggers when task.end increases further
  const impactMap=useMemo(()=>{
    if(!baselineEnd)return {};
    const map={};
    scheduled.forEach(task=>{
      const{delayed,extended,isNew}=getTS(task,baselineEnd,baselineTasks);
      if(delayed||extended||isNew){
        // For baseline tasks: use their original end. For new tasks: use task.end as reference.
        const orig=(baselineTasks||[]).find(o=>o.id===task.id);
        const origEnd=orig?orig.end:null;
        // Re-trigger check: skip only if task hasn't grown since last ignore
        const lastIgnored=ignoredImpacts[task.id];
        if(lastIgnored&&task.end<=lastIgnored)return;
        const impacted=findImpactedTasks(task,scheduled,baselineTasks,origEnd);
        if(impacted.length>0)map[task.id]=impacted;
      }
    });
    return map;
  },[scheduled,baselineEnd,baselineTasks,ignoredImpacts]);

  // Per-team summary — professional table data
  const teamSummary=useMemo(()=>projectTeams.map(team=>{
    const tt=scheduled.filter(t=>t.teamName===team.name);
    const supportTasks=scheduled.filter(t=>t.teamName!==team.name&&(t.supportTeams||[]).includes(team.name));
    const blTasks=(baselineTasks||[]).filter(t=>tt.some(s=>s.id===t.id));
    const blDays=blTasks.reduce((s,t)=>s+t.durationDays,0);
    const currDays=tt.reduce((s,t)=>s+t.durationDays,0);
    const supportDays=supportTasks.reduce((s,t)=>s+t.durationDays,0);
    const delayedTasks=tt.filter(t=>baselineEnd&&t.end>baselineEnd);
    const extendedTasks=tt.filter(t=>{const o=(baselineTasks||[]).find(o=>o.id===t.id);return o&&t.durationDays>o.durationDays;});
    const extDays=extendedTasks.reduce((s,t)=>{const o=(baselineTasks||[]).find(o=>o.id===t.id);return s+(o?t.durationDays-o.durationDays:0);},0);
    return{name:team.name,taskCount:tt.length,blDays,currDays,delayedCount:delayedTasks.length,extendedCount:extendedTasks.length,extDays,supportCount:supportTasks.length,supportDays};
  }),[projectTeams,scheduled,baselineEnd,baselineTasks]);

  const completionInfo=useMemo(()=>{
    if(!completedAt)return null;
    // Compare against baseline if set, otherwise against planned end (pe)
    const reference=baselineEnd||pe;
    if(!reference)return null;
    const d=diffDays(reference,completedAt);
    return d<0?{type:'early',days:Math.abs(d)}:d>0?{type:'late',days:d}:{type:'ontime'};
  },[completedAt,baselineEnd,pe]);

  // Team management
  const addTeam=()=>{
    const n=newTeamName.trim().slice(0,MAX_NAME);
    if(!n||projectTeams.some(t=>t.name===n))return;
    const nt={id:uid(),name:n,members:[]};
    updateProj(p=>({...p,projectTeams:[...(p.projectTeams||[]),nt],teams:[...p.teams,{id:nt.id,name:n}]}));
    setNewTeamName('');
  };
  const deleteTeam=teamId=>{
    const team=projectTeams.find(t=>t.id===teamId);
    if(!team)return;
    updateProj(p=>({...p,projectTeams:(p.projectTeams||[]).filter(t=>t.id!==teamId),tasks:p.tasks.filter(t=>t.teamName!==team.name),teams:p.teams.filter(t=>t.id!==teamId),items:p.items.filter(i=>i.teamId!==teamId)}));
    setConfirmDelTeam(null);
  };
  const addMember=(teamId)=>{
    const name=(newMember[teamId]||'').trim();
    if(!name)return;
    const team=(projectTeams||[]).find(t=>t.id===teamId);
    if(team&&(team.members||[]).some(m=>m.name.toLowerCase()===name.toLowerCase()))return;
    updateProj(p=>({...p,projectTeams:(p.projectTeams||[]).map(t=>t.id===teamId?{...t,members:[...(t.members||[]),{id:uid(),name}]}:t)}));
    setNewMember(p=>({...p,[teamId]:''}));
  };
  const deleteMember=(teamId,memberId)=>updateProj(p=>({...p,projectTeams:(p.projectTeams||[]).map(t=>t.id===teamId?{...t,members:(t.members||[]).filter(m=>m.id!==memberId)}:t)}));

  // Task management
  const addTask=form=>{updateProj(p=>({...p,tasks:[...p.tasks,{...form,id:uid()}]}));setActiveModal(null);};
  const editSave=form=>{
    updateProj(p=>({...p,tasks:p.tasks.map(t=>t.id===activeModal.task.id?{...form,id:t.id}:t)}));
    setActiveModal(null);
  };
  const delTask=id=>updateProj(p=>({...p,tasks:p.tasks.filter(t=>t.id!==id)}));
  const dupTask=task=>{
    const{id,...rest}=task;
    setActiveModal({mode:'dup',prefill:{...rest,name:rest.name+' (kopya)'}});
  };
  const setBaseline=()=>updateProj(p=>({...p,baselineEnd:pe,baselineTasks:JSON.parse(JSON.stringify(computeSched(p.tasks)))}));
  const resetBL=()=>updateProj(p=>({...p,baselineEnd:null,baselineTasks:null}));
  const doComplete=date=>{updateProj(p=>({...p,completedAt:date}));setShowComplete(false);};

  const[impactTask,setImpactTask]=useState(null);

  // Impact: postpone selected tasks
  const handlePostpone=(taskIds)=>{
    if(!impactTask)return;
    const orig=(baselineTasks||[]).find(o=>o.id===impactTask.id);
    // For new tasks (no baseline entry), use task.end as both reference and current
    const origEnd=orig?orig.end:impactTask.end;
    const shift=diffDays(origEnd,impactTask.end);
    if(shift<=0){setImpactTask(null);return;}
    updateProj(p=>({
      ...p,
      tasks:p.tasks.map(t=>{
        if(!taskIds.includes(t.id))return t;
        return{...t,startDate:addDays(t.startDate,shift)};
      }),
      ignoredImpacts:{...(p.ignoredImpacts||{}),[impactTask.id]:impactTask.end},
    }));
    setImpactTask(null);
  };
  const handleIgnore=()=>{
    if(!impactTask)return;
    // Store current task.end → re-triggers if task grows beyond this
    setIgnoredImpact(impactTask.id,impactTask.end);
    setImpactTask(null);
  };

  const doExport=()=>{
    const data=scheduled.map(t=>{const o=(baselineTasks||[]).find(o=>o.id===t.id);const oe=o?o.end:t.end;return{'Görev':t.name,'Ekip':t.teamName||'','Destek Ekipler':(t.supportTeams||[]).join(', '),'Süre (g)':t.durationDays,'Başlangıç':t.start,'Bitiş':t.end,'Baseline Bitiş':o?oe:'—','Gecikme (g)':o?Math.max(0,diffDays(oe,t.end)):0,'Uzama (g)':o&&t.durationDays>o.durationDays?t.durationDays-o.durationDays:0};});
    const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Gantt');XLSX.writeFile(wb,`${proj.name}_gantt.xlsx`);
  };

  const doImportGantt=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'binary'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws);
        const newTasks=rows.filter(r=>r['Görev']&&r['Başlangıç']).map(r=>({
          id:uid(),
          name:String(r['Görev']),
          teamName:String(r['Ekip']||''),
          supportTeams:String(r['Destek Ekipler']||'').split(',').map(s=>s.trim()).filter(Boolean),
          startDate:String(r['Başlangıç']).slice(0,10),
          durationDays:Math.max(1,parseInt(r['Süre (g)'])||1),
          durationInput:Math.max(1,parseInt(r['Süre (g)'])||1),
          durationMode:'days',
          sprintWeeks:2,
        }));
        if(newTasks.length===0){alert('Geçerli görev bulunamadı. "Görev" ve "Başlangıç" sütunlarının dolu olduğundan emin olun.');return;}
        // Auto-create teams from primary + support teams in imported data
        const allTeamNames=[...new Set([...newTasks.map(t=>t.teamName),...newTasks.flatMap(t=>t.supportTeams)].filter(Boolean))];
        const teamNames=allTeamNames;
        updateProj(p=>{
          const existingTeamNames=(p.projectTeams||[]).map(t=>t.name);
          const newTeams=teamNames.filter(n=>!existingTeamNames.includes(n)).map(n=>({id:uid(),name:n,members:[]}));
          const newTrackerTeams=newTeams.map(t=>({id:t.id,name:t.name}));
          return{
            ...p,
            tasks:[...p.tasks,...newTasks],
            projectTeams:[...(p.projectTeams||[]),...newTeams],
            teams:[...p.teams,...newTrackerTeams],
          };
        });
        alert(`${newTasks.length} görev başarıyla içe aktarıldı.`);
      }catch(err){alert('Import hatası: '+err.message);}
    };
    reader.readAsBinaryString(file);
    e.target.value='';
  };
  const doPng=async()=>{
    if(!ganttRef.current)return;setExporting(true);
    try{const el=ganttRef.current,orig=el.scrollLeft;el.scrollLeft=0;const canvas=await html2canvas(el,{backgroundColor:'#ffffff',scale:2,useCORS:true,scrollX:0,scrollY:0,width:el.scrollWidth,windowWidth:el.scrollWidth+200});el.scrollLeft=orig;const link=document.createElement('a');link.download=`${proj.name}_gantt.png`;link.href=canvas.toDataURL('image/png');link.click();}
    catch(e){alert('PNG export hatası: '+e.message);}
    setExporting(false);
  };

  return(<div>
    {/* Summary */}
    <div className="acc" style={{marginBottom:14}}>
      <div className="acc-hdr" onClick={()=>setSumOpen(o=>!o)}>
        <span className={`acc-arr${sumOpen?' open':''}`}>▶</span>
        <span style={{fontWeight:600,fontSize:'.88rem',flex:1}}>Proje Özeti</span>
        {completedAt&&<span className="badge b-tl">🏁 Sonlandırıldı</span>}
        {!completedAt&&delay>0&&<span className="badge b-rd">⚠ {delay}g gecikme</span>}
        {!completedAt&&delay===0&&baselineEnd&&pe&&<span className="badge b-gr">✓ Zamanında</span>}

          <div className="scard">
            {completedAt&&completionInfo?(<><div className="scard-val" style={{color:completionInfo.type==='early'?'var(--green)':completionInfo.type==='late'?'var(--red)':'var(--text2)'}}>{completionInfo.type==='early'?`-${completionInfo.days}g`:completionInfo.type==='late'?`+${completionInfo.days}g`:'—'}</div><div className="scard-lbl">{completionInfo.type==='early'?'Erken Bitti':completionInfo.type==='late'?'Gecikmeli':'Zamanında'}</div></>):(<><div className="scard-val" style={{color:delay>0?'var(--red)':'var(--text3)'}}>{delay>0?`+${delay}g`:'—'}</div><div className="scard-lbl">Gecikme</div>{!baselineEnd&&<div className="scard-sub">Baseline belirlenmedi</div>}</>)}

          <table className="team-sum-table">
            <thead>

                {baselineEnd&&<th style={{width:'9%'}}>Uzama</th>}

            </thead>
            <tbody>

                return(<div key={t.id} className={`titem${cls}`} style={{borderLeft:`3px solid ${tColor}`}}>
                  <div className="titem-top">
                    <span className="titem-num">{i+1}</span>
                    <div className="titem-body">
                      <div className="titem-name">{t.name}</div>
                      {t.teamName&&<div className="titem-team" title={t.teamName} style={{color:tColor}}>● {t.teamName}</div>}

                      <div className="titem-meta">{t.durationDays}g · {fmt(t.start)} → {fmt(t.end)}</div>
                      <div className="titem-flags">

                        {isNew&&!delayed&&<span className="badge b-bl">+ Baseline sonrası</span>}
                      </div>
                      {origT&&origT.durationDays!==t.durationDays&&<div style={{fontSize:'.66rem',color:'var(--text2)',fontFamily:'var(--fm)',marginTop:2}}>Orijinal: {origT.durationDays}g</div>}
                    </div>
                    <div className="titem-actions">

              {!completedAt&&baselineEnd&&tasks.length>0&&<button className="btn btn-tl btn-sm" onClick={()=>setShowComplete(true)}>🏁 Sonlandır</button>}
            </div>
            <div style={{display:'flex',gap:6,marginTop:8}}>
              {tasks.length>0&&<button className="btn btn-gr btn-sm" onClick={doExport}>📊 Excel</button>}
              {tasks.length>0&&<button className="btn btn-sh btn-sm" onClick={doPng} disabled={exporting}>{exporting?'⏳':'🖼 PNG'}</button>}
              {!completedAt&&<label className="btn btn-or btn-sm" style={{cursor:'pointer',margin:0}}>

            <div className="divider"/>
            <div className="g-legend">
              <div className="g-legend-i"><div className="g-legend-d" style={{background:'#059669'}}/>Tamamlanan</div>
              <div className="g-legend-i"><div className="g-legend-d" style={{background:'#1d4ed8'}}/>Planlanan</div>
              <div className="g-legend-i"><div className="g-legend-d" style={{background:'#ea580c'}}/>Uzama</div>
              <div className="g-legend-i"><div className="g-legend-d" style={{background:'#b91c1c'}}/>Gecikme</div>
              <div className="g-legend-i"><div className="g-legend-d" style={{background:'#9ca3af'}}/>Tamamlanan sonrası</div>
            </div>
          </div>}
        </div>
      </div>

      {/* Gantt */}
      <div className="gantt-wrap">
        <div className="gantt-top">
          <span style={{fontFamily:'var(--fd)',fontWeight:700,fontSize:'.9rem'}}>Gantt — {proj.name}</span>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            {projectTeams.length>0&&<div style={{display:'flex',gap:5,alignItems:'center'}}>

              <select className="sel" style={{width:'auto',padding:'3px 8px',fontSize:'.75rem',maxWidth:130}} value={tFilt} onChange={e=>setTFilt(e.target.value)}>
                <option value="all">Tümü</option>
                {projectTeams.map(t=><option key={t.id} value={t.name} title={t.name}>{t.name.length>14?t.name.slice(0,14)+'…':t.name}</option>)}

            <button className={`btn btn-sm ${ganttSortDate?'btn-p':'btn-g'}`} onClick={()=>setGanttSortDate(v=>!v)} title="Ekip sınırı olmaksızın tarihe göre sırala" style={{fontSize:'.72rem',padding:'3px 8px'}}>
              📅 {ganttSortDate?'Ekip Bağımsız':'Ekip Bazlı'}
            </button>
            {tasks.length>0&&<span className="badge b-bl">📍 {fmt(todayStr())}</span>}
          </div>
        </div>
        <GanttChart scheduled={scheduled} baselineTasks={baselineTasks} baselineEnd={baselineEnd} completedAt={completedAt} teamFilter={tFilt} ganttRef={ganttRef} onBarClick={t=>!completedAt&&setActiveModal({mode:'edit',task:t})} impactMap={impactMap} onImpactClick={task=>setImpactTask(task)} projectTeams={projectTeams} sortByDate={ganttSortDate}
          onDragSelect={canAdd?({startDate,durationDays,teamName})=>{
            setActiveModal({mode:'new',prefill:{startDate,durationDays,durationInput:durationDays,durationMode:'days',teamName:ganttSortDate?'':teamName||'',sprintWeeks:2}});
          }:null}

            setActiveModal({mode:'new',prefill:{teamName:teamName||'',startDate:todayStr()}});
          }:null}
          onBarResize={!completedAt?(task,newDays,commit)=>{
            if(commit){
              updateProj(p=>({...p,tasks:p.tasks.map(t=>t.id===task.id?{...t,durationDays:newDays,durationInput:newDays,durationMode:'days'}:t)}));
            }
          }:null}
        />
      </div>
    </div>

    {activeModal&&activeModal.mode==='edit'&&<TaskModal initial={activeModal.task} tasks={tasks} projectTeams={projectTeams} projStartDate={ps} baselineEnd={baselineEnd} onSave={editSave} onClose={()=>setActiveModal(null)}/>}
    {activeModal&&activeModal.mode==='new'&&<TaskModal prefill={activeModal.prefill||null} isDuplicate={false} tasks={tasks} projectTeams={projectTeams} projStartDate={ps} baselineEnd={baselineEnd} onSave={addTask} onClose={()=>setActiveModal(null)}/>}
    {activeModal&&activeModal.mode==='dup'&&<TaskModal initial={activeModal.prefill||null} isDuplicate={true} tasks={tasks} projectTeams={projectTeams} projStartDate={ps} baselineEnd={baselineEnd} onSave={addTask} onClose={()=>setActiveModal(null)}/>}
    {showAll&&<TasksFullModal scheduled={scheduled} baselineTasks={baselineTasks} baselineEnd={baselineEnd} readOnly={!!completedAt} onEdit={t=>{setActiveModal({mode:'edit',task:t});setShowAll(false);}} onDelete={id=>{delTask(id);}} onDuplicate={t=>dupTask(t)} onClose={()=>setShowAll(false)}/>}
    {showComplete&&<CompleteProjectModal proj={proj} onSave={doComplete} onClose={()=>setShowComplete(false)}/>}
    {confirmDelTeam&&<ConfirmModal title="Ekibi Sil" message={`"${projectTeams.find(t=>t.id===confirmDelTeam)?.name}" ekibini ve tüm görevlerini/iş öğelerini silmek istiyor musunuz?`} onConfirm={()=>deleteTeam(confirmDelTeam)} onCancel={()=>setConfirmDelTeam(null)}/>}
